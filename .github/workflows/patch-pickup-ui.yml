name: Patch pickup completion UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-pickup-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Aplicar patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text()
          marker='\n  async function reconcileStoreRefund(order: Order) {'
          if marker not in s:
              raise SystemExit('marker function not found')
          fn='''\n  async function completePickup(order: Order) {\n    if (!store || processingOrder) return;\n    if (!window.confirm(`Confirmar que o pedido #${order.order_number} foi retirado pelo cliente?`)) return;\n    setProcessingOrder(order.id);\n    setMessage("");\n    const { data, error } = await supabase.functions.invoke("complete-store-pickup", { body: { orderId: order.id } });\n    setProcessingOrder(null);\n    if (error || data?.error) {\n      const code = String(data?.error ?? "");\n      setMessage(code === "PAYMENT_NOT_CONFIRMED" ? "O pagamento deste pedido ainda não está confirmado." : code === "ORDER_NOT_READY" ? "O pedido precisa estar marcado como pronto antes da retirada." : "Não foi possível concluir a retirada agora.");\n      await loadStoreData(store);\n      return;\n    }\n    setMessage("Retirada concluída. Pedido e pagamento finalizados com sucesso.");\n    await loadStoreData(store);\n  }\n'''
          s=s.replace(marker,fn+marker,1)
          old='{order.status === "READY" && order.delivery_type === "DELIVERY" && <button onClick={() => retryDispatch(order)}>Chamar entregador</button>}'
          if old not in s:
              raise SystemExit('ready delivery button not found')
          new=old+'\n              {order.status === "READY" && order.delivery_type === "PICKUP" && <button disabled={processingOrder === order.id} onClick={() => completePickup(order)}>Confirmar retirada</button>}'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Validar Painel Lojista
        run: npm run build:lojista

      - name: Remover workflow temporário e publicar
        run: |
          rm .github/workflows/patch-pickup-ui.yml
          git config user.name "click-food-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/lojista/app/page.tsx .github/workflows/patch-pickup-ui.yml
          git commit -m "feat: concluir pedidos de retirada na loja"
          git push
