name: CLICK-FOOD Cliente APK Avaliacao Detalhada

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cliente-review-20260904.yml'

permissions:
  contents: read

concurrency:
  group: click-food-cliente-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cliente:
    name: APK Cliente Avaliacao Detalhada
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      JAVA_TOOL_OPTIONS: '-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configurar Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          EOF
      - name: Instalar dependencias
        run: npm ci --include=dev
      - name: Validar Cliente
        working-directory: apps/cliente
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN não configurado.'; exit 1; }
          npx tsc --noEmit
          npx expo config --type public > "$RUNNER_TEMP/expo-cliente.json"
          grep -q '52e2d5ff-faaa-4245-8564-47b9a4963fbb' "$RUNNER_TEMP/expo-cliente.json"
          grep -q 'customer-review-submit' CustomerDetailedReview.tsx
          grep -q 'temperature' CustomerDetailedReview.tsx
          grep -q 'taste' CustomerDetailedReview.tsx
          npx --yes eas-cli@latest whoami >/dev/null
          npx --yes eas-cli@latest project:info --non-interactive
      - name: Compilar APK Cliente
        working-directory: apps/cliente
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/eas-local-cliente-review"
          mkdir -p "$OUT"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$OUT"
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive
          APK="$(find "$OUT" -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then APK="$(find . -type f -name '*.apk' | head -n 1 || true)"; fi
          test -n "$APK" || { echo 'APK Cliente não encontrado.'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/CLICK-FOOD-Cliente-Avaliacao-Detalhada.apk"
          test -s "$GITHUB_WORKSPACE/artifacts/CLICK-FOOD-Cliente-Avaliacao-Detalhada.apk"
          unzip -tq "$GITHUB_WORKSPACE/artifacts/CLICK-FOOD-Cliente-Avaliacao-Detalhada.apk" >/dev/null
      - name: Publicar APK Cliente
        uses: actions/upload-artifact@v4
        with:
          name: CLICK-FOOD-Cliente-APK-Avaliacao-Detalhada
          path: artifacts/CLICK-FOOD-Cliente-Avaliacao-Detalhada.apk
          if-no-files-found: error
          retention-days: 30
