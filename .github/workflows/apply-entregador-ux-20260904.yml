name: Apply Entregador UX 20260904

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-entregador-ux-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar UX final do Entregador
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path('apps/entregador/App.tsx')
          s=app.read_text()
          old='  const completedTotal=useMemo(()=>history.reduce((sum,item)=>sum+item.driverEarning,0),[history]);\n  const earningsText=(value:number)=>earningsVisible?brl(value):"R$ ••••";'
          new='  const completedTotal=useMemo(()=>history.reduce((sum,item)=>sum+item.driverEarning,0),[history]);\n  const todayKey=new Date().toLocaleDateString("pt-BR");\n  const todayTotal=useMemo(()=>history.filter(item=>item.deliveredAt&&new Date(item.deliveredAt).toLocaleDateString("pt-BR")===todayKey).reduce((sum,item)=>sum+item.driverEarning,0),[history,todayKey]);\n  const earningsText=(value:number)=>earningsVisible?brl(value):"R$ ••••";'
          assert old in s, 'bloco de ganhos não encontrado'
          s=s.replace(old,new,1)

          pattern=r'\n    <Pressable accessibilityRole="button" accessibilityLabel=\{earningsVisible\?"Ocultar ganhos":"Mostrar ganhos"\} style=\{styles\.earningsEyeButton\} onPress=\{\(\)=>setEarningsVisible\(value=>!value\)\}><Text style=\{styles\.earningsEyeIcon\}>\{earningsVisible\?"👁️":"🙈"\}</Text><Text style=\{styles\.earningsEyeText\}>\{earningsVisible\?"OCULTAR GANHOS":"MOSTRAR GANHOS"\}</Text></Pressable>\n    <Pressable accessibilityRole="button" accessibilityLabel="Ativar bolinha flutuante" style=\{styles\.floatingBubbleButton\} onPress=\{activateFloatingBubble\}><Text style=\{styles\.floatingBubbleDot\}>●</Text><Text style=\{styles\.floatingBubbleText\}>BOLINHA</Text></Pressable>'
          replacement='\n    <View style={styles.todayEarningsTop}><View style={{flex:1}}><Text style={styles.todayEarningsLabel}>GANHOS DE HOJE</Text><Text style={styles.todayEarningsValue}>{earningsText(todayTotal)}</Text></View><Pressable accessibilityRole="button" accessibilityLabel={earningsVisible?"Ocultar ganhos":"Mostrar ganhos"} style={styles.earningsEyeOnly} onPress={()=>setEarningsVisible(value=>!value)}><Text style={styles.earningsEyeIcon}>👁️</Text></Pressable></View>'
          s,n=re.subn(pattern,replacement,s,count=1)
          assert n==1, 'controles bolinha/olho não encontrados'

          s=s.replace('{history.length} entregas • {driver.rating.toFixed(1)} ★ • {earningsText(completedTotal)}','{history.length} entregas • {driver.rating.toFixed(1)} ★',1)
          s=s.replace('{statusBusy?"ALTERANDO...":driver.online?"FICAR OFFLINE":"FICAR ONLINE"}','{statusBusy?"ALTERANDO...":driver.online?"ONLINE":"OFFLINE"}',1)
          s=s.replace('mapOnlineButton:{backgroundColor:"#f4c400",borderRadius:12,paddingVertical:11,paddingHorizontal:14}','mapOnlineButton:{backgroundColor:"#d83b32",borderRadius:12,paddingVertical:11,paddingHorizontal:14,borderWidth:1,borderColor:"#a92620"}',1)
          s=s.replace('mapOfflineButton:{backgroundColor:"#242424",borderWidth:1,borderColor:"#555"}','mapOfflineButton:{backgroundColor:"#20a85a",borderWidth:1,borderColor:"#15743e"}',1)
          s=s.replace('mapOnlineText:{fontSize:10,fontWeight:"900",color:"#111"}','mapOnlineText:{fontSize:10,fontWeight:"900",color:"#fff"}',1)
          marker='nextStepTitle:{fontSize:12,color:"#fff",fontWeight:"800",lineHeight:16,marginTop:3},\n});'
          add='nextStepTitle:{fontSize:12,color:"#fff",fontWeight:"800",lineHeight:16,marginTop:3},\n  todayEarningsTop:{position:"absolute",top:78,left:10,zIndex:30,elevation:9,minWidth:170,maxWidth:220,backgroundColor:"rgba(17,17,17,0.95)",borderWidth:1,borderColor:"#f4c400",borderRadius:14,paddingVertical:8,paddingLeft:11,paddingRight:7,flexDirection:"row",alignItems:"center",gap:8},\n  todayEarningsLabel:{fontSize:8,color:"#aaa",fontWeight:"900",letterSpacing:.8},\n  todayEarningsValue:{fontSize:18,color:"#fff",fontWeight:"900",marginTop:2},\n  earningsEyeOnly:{width:32,height:32,borderRadius:16,alignItems:"center",justifyContent:"center",backgroundColor:"#272727"},\n});'
          assert marker in s, 'fim de styles não encontrado'
          s=s.replace(marker,add,1)
          app.write_text(s)

          shell=Path('apps/entregador/DriverProfessionalShell.tsx')
          x=shell.read_text()
          x=x.replace('import DriverSupport from"./DriverSupport";','import DriverSupport from"./DriverSupport";\nimport DriverReports from"./DriverReports";\nimport DriverReviews from"./DriverReviews";',1)
          x=x.replace('type Section="APP"|"HISTORY"|"REPORTS"|"WALLET"|"PIX"|"CHAT"|"SUPPORT"|"ACCOUNT";','type Section="APP"|"HISTORY"|"REPORTS"|"REVIEWS"|"WALLET"|"PIX"|"CHAT"|"SUPPORT"|"ACCOUNT";',1)
          x=x.replace('if(section==="HISTORY"||section==="REPORTS")void loadHistory();','if(section==="HISTORY")void loadHistory();',1)
          old_render='section==="REPORTS"?<ReportsScreen/>:section==="WALLET"?<WalletScreen/>'
          new_render='section==="REPORTS"?<DriverReports onBack={()=>setSection("APP")}/>:section==="REVIEWS"?<DriverReviews onBack={()=>setSection("APP")}/>:section==="WALLET"?<WalletScreen/>'
          assert old_render in x, 'render de relatórios não encontrado'
          x=x.replace(old_render,new_render,1)
          old_menu='["HISTORY","▤","Histórico de entregas"],["REPORTS","▥","Relatórios"],["WALLET","$","Ganhos e repasses"]'
          new_menu='["HISTORY","▤","Histórico de entregas"],["REPORTS","▥","Relatórios"],["REVIEWS","★","Avaliações"],["WALLET","$","Ganhos e repasses"]'
          assert old_menu in x, 'menu não encontrado'
          x=x.replace(old_menu,new_menu,1)
          x=x.replace('onlineState:{fontSize:10,fontWeight:"800",color:"#999",marginTop:2}','onlineState:{fontSize:10,fontWeight:"900",color:"#e14b42",marginTop:2}',1)
          anchor=' useEffect(()=>{if(!session)return;if(section==="HISTORY")void loadHistory();if(section==="PIX")void loadPixProfile();if(section==="CHAT")void openChat(chatType);},[section,session?.user.id]);'
          assert anchor in x, 'useEffect de seção não encontrado'
          x=x.replace(anchor,anchor+'\n useEffect(()=>{if(!session?.user.id)return;const timer=setInterval(()=>void loadDriver(),1200);return()=>clearInterval(timer);},[session?.user.id]);',1)
          shell.write_text(x)
          PY
      - name: Instalar dependências
        run: npm ci --include=dev
      - name: Validar TypeScript Entregador
        working-directory: apps/entregador
        run: npx tsc --noEmit
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/entregador/App.tsx apps/entregador/DriverProfessionalShell.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(entregador): ganhos hoje status visual e avaliações"
          git push
