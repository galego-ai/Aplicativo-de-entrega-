name: Patch card UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-card-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply card UI patch
        run: python .github/scripts/patch_card_ui.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type-check Cliente
        run: npx tsc --noEmit -p apps/cliente/tsconfig.json

      - name: Commit patched app
        run: |
          rm -f .github/scripts/patch_card_ui.py .github/workflows/patch-card-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: integrar cartão Efí seguro no App Cliente'
          git pull --rebase origin main
          git push origin HEAD:main
