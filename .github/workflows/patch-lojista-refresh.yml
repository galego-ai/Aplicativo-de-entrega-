name: Patch lojista refresh

on:
  push:
    paths:
      - .github/workflows/patch-lojista-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reduzir refresh completo do dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path("apps/lojista/app/page.tsx")
          s=p.read_text(encoding="utf-8")
          old='const timer = setInterval(() => loadStoreData(store), 20000);'
          new='const timer = setInterval(() => loadStoreData(store), 60000);'
          if old not in s: raise SystemExit("intervalo esperado não encontrado")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
      - name: Build Lojista
        run: npm --workspace @clickfood/lojista run build
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "perf: reduzir consultas periódicas do lojista"
          git pull --rebase origin main
          git push origin HEAD:main
