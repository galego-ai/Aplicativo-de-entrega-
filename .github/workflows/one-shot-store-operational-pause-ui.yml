name: CLICK-FOOD One-shot Store Operational Pause UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-store-operational-pause-ui.yml'

permissions:
  contents: write

jobs:
  patch-store-pause-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar estado de pausa no App Cliente
        run: python3 scripts/patch_store_operational_pause_ui.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cliente/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Exibir pausa operacional no app Cliente"
          git push origin main
