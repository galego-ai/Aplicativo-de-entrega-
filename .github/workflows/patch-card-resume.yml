# one-shot patch workflow; remove after success
name: Patch card resume
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-card-resume.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch App Cliente
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/cliente/App.tsx')
          s = p.read_text(encoding='utf-8')

          old_effect = '  useEffect(()=>{if(!session)return;const timer=setInterval(()=>loadStores(),60000);return()=>clearInterval(timer);},[session?.user.id]);\n'
          new_effect = old_effect + '  useEffect(()=>{if(session&&cardTokenization)void loadOrders();},[session?.user.id,cardTokenization?.accountId]);\n'
          if new_effect not in s:
              if old_effect not in s:
                  raise SystemExit('store timer anchor not found')
              s = s.replace(old_effect, new_effect, 1)

          anchor = '  async function refreshPix(orderId:string){\n'
          fn = '''  async function loadPendingCard(currentOrders:Order[]){
    if(!session)return;
    const pending=currentOrders.find(order=>order.status==="PENDING_PAYMENT"&&order.payment_status==="PENDING");
    if(!pending){
      setPendingCardOrder(current=>current&&currentOrders.some(order=>order.id===current.orderId&&order.status==="PENDING_PAYMENT")?current:null);
      return;
    }
    const{data:payment}=await supabase.from("payments").select("method").eq("order_id",pending.id).order("created_at",{ascending:false}).limit(1).maybeSingle();
    if(payment?.method!=="CREDIT_CARD")return;
    const{data:charge}=await supabase.from("efi_card_charges").select("charge_id,status").eq("order_id",pending.id).maybeSingle();
    if(charge?.charge_id){
      const statusResult=await supabase.functions.invoke("efi-card-status",{body:{orderId:pending.id}});
      const status=String(statusResult.data?.status??charge.status??"").toUpperCase();
      const paid=Boolean(statusResult.data?.paid||status==="PAID");
      const approved=Boolean(statusResult.data?.approved||status==="APPROVED");
      setPendingCardOrder(null);
      if(!statusResult.error&&paid)setMessage("Pagamento no cartão confirmado! Seu pedido foi enviado para a loja.");
      else if(!statusResult.error&&approved)setMessage("Cartão aprovado pela Efí. Aguardando a confirmação final do pagamento.");
      else if(!statusResult.error&&["WAITING","PROCESSING"].includes(status))setMessage("Pagamento no cartão em processamento. A Efí está confirmando o status.");
      return;
    }
    if(cardTokenization)setPendingCardOrder(current=>current?.orderId===pending.id?current:{orderId:pending.id,total:pending.total});
  }

'''
          if '  async function loadPendingCard(currentOrders:Order[]){' not in s:
              if anchor not in s:
                  raise SystemExit('refreshPix anchor not found')
              s = s.replace(anchor, fn + anchor, 1)

          old_load = '    setOrders(rows);await Promise.all([loadPendingPix(rows),loadRefunds(rows),loadTracking(rows)]);\n'
          new_load = '    setOrders(rows);await Promise.all([loadPendingPix(rows),loadPendingCard(rows),loadRefunds(rows),loadTracking(rows)]);\n'
          if new_load not in s:
              if old_load not in s:
                  raise SystemExit('loadOrders anchor not found')
              s = s.replace(old_load, new_load, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'galego-ai'
          git config user.email 'elismarribeiro298@gmail.com'
          git add apps/cliente/App.tsx
          git commit -m 'feat: retomar checkout de cartão com segurança'
          git push
