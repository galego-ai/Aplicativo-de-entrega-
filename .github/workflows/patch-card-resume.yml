name: Patch card resume

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-card-resume.yml'
      - 'scripts/patch-card-resume.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python scripts/patch-card-resume.py

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/cliente/App.tsx
          git commit -m 'feat: retomar checkout de cartão com segurança'
          git push
