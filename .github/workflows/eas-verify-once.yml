name: CLICK-FOOD EAS Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do monorepo
        run: npm ci --include=dev
      - name: Validar EXPO_TOKEN
        run: |
          test -n "${EXPO_TOKEN:-}"
          echo "EXPO_TOKEN_PRESENT"
      - name: Identidade Expo
        run: npx --yes eas-cli@latest whoami
      - name: Projeto Entregador
        working-directory: apps/entregador
        run: npx --yes eas-cli@latest project:info --non-interactive
      - name: Vincular Cliente ao projeto EAS pelo slug
        working-directory: apps/cliente
        run: npx --yes eas-cli@latest init --account galego-ais-team --non-interactive --json
      - name: Projeto Cliente
        working-directory: apps/cliente
        run: npx --yes eas-cli@latest project:info --non-interactive
