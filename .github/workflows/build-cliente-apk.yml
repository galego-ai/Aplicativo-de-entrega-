name: CLICK-FOOD Cliente APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cliente-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        working-directory: apps/cliente
        run: npx expo prebuild --platform android --non-interactive

      - name: Compilar APK standalone
        working-directory: apps/cliente/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar bundle e preparar APK
        run: |
          test -f apps/cliente/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp apps/cliente/android/app/build/outputs/apk/release/app-release.apk artifacts/CLICK-FOOD-Cliente-Standalone.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLICK-FOOD-Cliente-Standalone-APK
          path: artifacts/CLICK-FOOD-Cliente-Standalone.apk
          if-no-files-found: error
          retention-days: 30
