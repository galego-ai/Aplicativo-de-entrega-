name: Patch Lojista Driver Link

on:
  push:
    paths:
      - '.github/workflows/patch-lojista-driver-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add manual driver assignment shortcut
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text()
          needle='</nav>'
          if s.count(needle) != 1:
              raise SystemExit(f'Expected exactly one </nav>, found {s.count(needle)}')
          link='</nav><a href="/entregadores" style={{display:"block",margin:"10px 0",padding:"12px 14px",borderRadius:10,background:"#f4c400",color:"#111",fontWeight:900,textDecoration:"none",textAlign:"center"}}>Atribuir entregador</a>'
          p.write_text(s.replace(needle,link,1))
          PY
      - run: npm ci
      - run: npm run build --workspace=@clickfood/lojista
      - name: Commit patch
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "feat: adicionar atalho para atribuir entregador" || exit 0
          git push
