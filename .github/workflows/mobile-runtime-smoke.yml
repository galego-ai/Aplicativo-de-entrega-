name: CLICK-FOOD Android Runtime Smoke

# Smoke final v6: bundle Release, metadado Maps, APK x86_64, instalação e abertura real no Android.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-runtime-smoke.yml'
      - '.github/scripts/android-runtime-smoke.sh'
      - 'apps/cliente/app.config.ts'
      - 'apps/cliente/app.json'
      - 'apps/cliente/metro.config.js'
      - 'apps/cliente/package.json'
      - 'apps/entregador/app.config.ts'
      - 'apps/entregador/app.json'
      - 'apps/entregador/metro.config.js'
      - 'apps/entregador/package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cliente
            package: br.com.clickfood.cliente
          - app: entregador
            package: br.com.clickfood.entregador
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependências
        run: npm ci --include=dev
      - name: Conferir React e matriz Expo usada pelo app
        working-directory: apps/${{ matrix.app }}
        run: |
          npx expo install --check
          node -e "console.log('react=', require.resolve('react')); console.log('version=', require('react/package.json').version); if(require('react/package.json').version !== '19.2.3') process.exit(1)"
          node -e "console.log('react-native=', require.resolve('react-native/package.json')); console.log('rn-version=', require('react-native/package.json').version)"
      - name: Validar bundle Metro isolado
        working-directory: apps/${{ matrix.app }}
        run: NODE_ENV=production npx expo export --platform android --output-dir /tmp/export-${{ matrix.app }} --clear
      - name: Gerar Android ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: NODE_ENV=production CI=1 npx expo prebuild --platform android
      - name: Validar metadado nativo do Google Maps
        run: |
          MANIFEST="apps/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -q 'com.google.android.geo.API_KEY' "$MANIFEST"
      - name: Compilar Release ${{ matrix.app }} para smoke
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          NODE_ENV=production ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Abrir APK e detectar crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-runtime-smoke.sh "${{ matrix.package }}" "apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk" "${{ matrix.app }}"
      - name: Publicar logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-${{ matrix.app }}
          path: ${{ matrix.app }}-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
