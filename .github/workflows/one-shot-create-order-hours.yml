name: CLICK-FOOD One-shot Create Order Hours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-create-order-hours.yml'

permissions:
  contents: write

jobs:
  patch-create-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Revalidar horário no create-order
        run: python3 scripts/patch_create_order_store_hours.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/create-order/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Revalidar horário da loja ao criar pedido"
          git push origin main
