name: Cleanup Lojista Refund Read

on:
  push:
    paths:
      - .github/workflows/cleanup-lojista-refund-read.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove obsolete direct refund loader
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('apps/lojista/app/page.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '  async function loadStoreRefunds(orderRows: any[]) {'
          if marker in text:
              start = text.index(marker)
              end = text.index('  async function loadStoreData(currentStore = store) {', start)
              text = text[:start] + text[end:]
              path.write_text(text, encoding='utf-8')
      - run: npm ci
      - run: npm run build:lojista
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "chore: remover leitura direta de estornos do lojista"
          git push
