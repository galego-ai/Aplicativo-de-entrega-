name: CLICK-FOOD Apps Android EAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mobile-apks.yml'
      - '.github/scripts/android-runtime-smoke.sh'
      - 'apps/cliente/**'
      - 'apps/entregador/**'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: click-food-eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    name: APK ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cliente
            label: Cliente
            package: br.com.clickfood.cliente
            filename: CLICK-FOOD-Cliente.apk
            artifact: CLICK-FOOD-Cliente-APK
          - app: entregador
            label: Entregador
            package: br.com.clickfood.entregador
            filename: CLICK-FOOD-Entregador.apk
            artifact: CLICK-FOOD-Entregador-APK
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Validar autenticação EAS
        run: |
          test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN não configurado."; exit 1; }
          npx --yes eas-cli@latest whoami >/dev/null

      - name: Validar projeto EAS ${{ matrix.label }}
        working-directory: apps/${{ matrix.app }}
        run: |
          npx expo install --check
          npx --yes eas-cli@latest project:info --non-interactive

      - name: Compilar APK ${{ matrix.label }} no EAS
        id: eas
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_JSON="$RUNNER_TEMP/eas-${{ matrix.app }}-build.json"
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > "$BUILD_JSON"

          node - "$BUILD_JSON" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const [jsonPath, outputPath] = process.argv.slice(2);
          const raw = fs.readFileSync(jsonPath, 'utf8').trim();
          if (!raw) throw new Error('EAS não retornou JSON do build.');
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[parsed.length - 1] : parsed;
          if (!build) throw new Error('Build EAS ausente na resposta.');
          const status = String(build.status || '').toUpperCase();
          if (status && status !== 'FINISHED') {
            throw new Error(`Build EAS terminou com status ${status}.`);
          }
          const url = build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl;
          if (!url) throw new Error('EAS não retornou URL do APK.');
          fs.appendFileSync(outputPath, `url=${url}\n`);
          if (build.id) fs.appendFileSync(outputPath, `build_id=${build.id}\n`);
          NODE

      - name: Baixar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="artifacts/${{ matrix.filename }}"
          curl --fail --location --retry 3 --retry-delay 2 \
            '${{ steps.eas.outputs.url }}' \
            --output "$APK"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null

      - name: Garantir Google Maps real no APK
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/${{ matrix.filename }}"
          MANIFEST_XML="$RUNNER_TEMP/${{ matrix.app }}-AndroidManifest.xml"

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -n "$SDK_ROOT" || { echo 'Android SDK não localizado.'; exit 1; }
            APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$APKANALYZER" || { echo 'apkanalyzer não encontrado no runner.'; exit 1; }

          "$APKANALYZER" manifest print "$APK" > "$MANIFEST_XML"
          grep -q 'com.google.android.geo.API_KEY' "$MANIFEST_XML" || {
            echo 'Metadado do Google Maps não encontrado no AndroidManifest compilado.'
            exit 1
          }
          if grep -q 'CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED' "$MANIFEST_XML"; then
            echo 'APK contém chave fallback do Google Maps.'
            exit 1
          fi
          rm -f "$MANIFEST_XML"
          echo 'Google Maps real confirmado no APK sem expor a chave.'

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Instalar, abrir e detectar crash no Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-runtime-smoke.sh "${{ matrix.package }}" "artifacts/${{ matrix.filename }}" "${{ matrix.app }}"

      - name: Publicar logcat do smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-${{ matrix.app }}
          path: ${{ matrix.app }}-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
