name: Patch Cliente Availability
on:
  push:
    paths:
      - '.github/workflows/patch-client-availability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteração isolada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/cliente/App.tsx')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'Trecho não encontrado: {label}')
              s=s.replace(old,new,1)

          rep('type Store = { id:string; name:string; description:string|null; logo_url:string|null; cover_url:string|null; minimum_order:number; average_preparation_time:number };',
              'type Store = { id:string; name:string; description:string|null; logo_url:string|null; cover_url:string|null; minimum_order:number; average_preparation_time:number; timezone:string; open_now:boolean };','tipo Store')

          rep('  useEffect(()=>{if(!session||tab!=="orders")return;const timer=setInterval(()=>loadOrders(),6000);return()=>clearInterval(timer);},[session?.user.id,tab]);',
              '  useEffect(()=>{if(!session||tab!=="orders")return;const timer=setInterval(()=>loadOrders(),6000);return()=>clearInterval(timer);},[session?.user.id,tab]);\n  useEffect(()=>{if(!session)return;const timer=setInterval(()=>loadStores(),60000);return()=>clearInterval(timer);},[session?.user.id]);','refresh de lojas')

          rep('  async function loadStores(){\n    const{data}=await supabase.from("stores").select("id,name,description,logo_url,cover_url,minimum_order,average_preparation_time").eq("status","ACTIVE").order("name").limit(50);\n    setStores((data??[]).map((s:any)=>({...s,minimum_order:Number(s.minimum_order),average_preparation_time:Number(s.average_preparation_time)})));\n  }',
              '  async function loadStores(){\n    const{data,error}=await supabase.functions.invoke("store-catalog");\n    if(error||data?.error)return;\n    const rows=(data?.stores??[]) as Store[];\n    setStores(rows);\n    setSelectedStore(current=>current?(rows.find(s=>s.id===current.id)??current):current);\n  }','loadStores')

          rep('  async function placeOrder(){\n    if(!session||!selectedStore||!cart.length)return;\n    if(cartSubtotal<selectedStore.minimum_order)',
              '  async function placeOrder(){\n    if(!session||!selectedStore||!cart.length)return;\n    if(!selectedStore.open_now){setMessage("Esta loja está fechada agora. Você pode consultar o cardápio, mas o pedido só poderá ser enviado quando ela abrir.");return;}\n    if(cartSubtotal<selectedStore.minimum_order)','bloqueio checkout')

          rep('      <Text style={styles.meta}>Pedido mínimo {brl(selectedStore.minimum_order)} • preparo médio {selectedStore.average_preparation_time} min</Text>',
              '      <Text style={styles.meta}>Pedido mínimo {brl(selectedStore.minimum_order)} • preparo médio {selectedStore.average_preparation_time} min</Text>\n      <Text style={[styles.storeStatusBanner,selectedStore.open_now?styles.storeOpenBanner:styles.storeClosedBanner]}>{selectedStore.open_now?"ABERTA AGORA":"FECHADA AGORA"}</Text>','status no cardápio')

          rep('      <Pressable style={[styles.checkout,!cart.length&&styles.disabled]} disabled={!cart.length||placing} onPress={placeOrder}><Text style={styles.checkoutText}>{placing?"ENVIANDO PEDIDO...":"FAZER PEDIDO"}</Text></Pressable>',
              '      <Pressable style={[styles.checkout,(!cart.length||!selectedStore.open_now)&&styles.disabled]} disabled={!cart.length||placing||!selectedStore.open_now} onPress={placeOrder}><Text style={styles.checkoutText}>{!selectedStore.open_now?"LOJA FECHADA":placing?"ENVIANDO PEDIDO...":"FAZER PEDIDO"}</Text></Pressable>','botão checkout')

          rep('<Text style={styles.meta}>Mínimo {brl(store.minimum_order)}</Text></View><Text>›</Text></Pressable>',
              '<Text style={styles.meta}>Mínimo {brl(store.minimum_order)}</Text><Text style={[styles.storeStatus,store.open_now?styles.storeOpen:styles.storeClosed]}>{store.open_now?"ABERTA":"FECHADA"}</Text></View><Text>›</Text></Pressable>','status home')

          rep('<Text style={styles.meta}>{store.description||"Cardápio disponível"}</Text></View><Text>›</Text></Pressable>)}',
              '<Text style={styles.meta}>{store.description||"Cardápio disponível"}</Text><Text style={[styles.storeStatus,store.open_now?styles.storeOpen:styles.storeClosed]}>{store.open_now?"ABERTA":"FECHADA"}</Text></View><Text>›</Text></Pressable>)}','status busca')

          rep('  productRow:{backgroundColor:"#fff",borderWidth:1,borderColor:"#e8e8e8",borderRadius:15,padding:12,marginBottom:9,flexDirection:"row",alignItems:"center",gap:10},',
              '  storeStatus:{fontSize:9,fontWeight:"900",paddingHorizontal:7,paddingVertical:4,borderRadius:999,alignSelf:"flex-start",marginTop:6,overflow:"hidden"},storeOpen:{backgroundColor:"#ddf6e6",color:"#1d7342"},storeClosed:{backgroundColor:"#fde5e1",color:"#992f29"},storeStatusBanner:{padding:10,borderRadius:12,fontSize:11,fontWeight:"900",marginTop:10,textAlign:"center"},storeOpenBanner:{backgroundColor:"#ddf6e6",color:"#1d7342"},storeClosedBanner:{backgroundColor:"#fde5e1",color:"#992f29"},\n  productRow:{backgroundColor:"#fff",borderWidth:1,borderColor:"#e8e8e8",borderRadius:15,padding:12,marginBottom:9,flexDirection:"row",alignItems:"center",gap:10},','estilos disponibilidade')

          p.write_text(s)
          PY
          rm .github/workflows/patch-client-availability.yml
          git config user.name 'clickfood-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/cliente/App.tsx .github/workflows/patch-client-availability.yml
          git diff --cached --check
          git commit -m 'feat: mostrar lojas abertas e fechadas no cliente'
          git push
