name: Patch lojista edge read

on:
  push:
    paths:
      - .github/workflows/patch-lojista-edge-read.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Usar Edge Function segura no dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path("apps/lojista/app/page.tsx")
          s=p.read_text(encoding="utf-8")
          old_des='const [metricsResult, productsResult, ordersResult, cashResult, inventoryResult, couponsResult, financeResult, deliveriesResult, bonusWalletResult, bonusTxResult, loyaltyResult] = await Promise.all(['
          new_des='const [dashboardResult, productsResult, ordersResult, cashResult, inventoryResult, financeResult, deliveriesResult, bonusWalletResult, bonusTxResult, loyaltyResult] = await Promise.all(['
          old_metrics='supabase.rpc("store_dashboard_metrics", { p_store_id: currentStore.id }),' 
          new_metrics='supabase.functions.invoke("store-dashboard-read", { body: { storeId: currentStore.id } }),' 
          old_coupon='      supabase.rpc("store_coupon_list", { p_store_id: currentStore.id }),\n'
          old_metric_set='if (metricsResult.data) setMetrics({ ...emptyMetrics, ...(metricsResult.data as Metrics) });'
          new_metric_set='if (dashboardResult.data?.metrics) setMetrics({ ...emptyMetrics, ...(dashboardResult.data.metrics as Metrics) });'
          old_coupon_set='if (Array.isArray(couponsResult.data)) setCoupons(couponsResult.data.map((item: any) => ({ ...item, discount_value: Number(item.discount_value), minimum_order: Number(item.minimum_order) })));'
          new_coupon_set='if (Array.isArray(dashboardResult.data?.coupons)) setCoupons(dashboardResult.data.coupons.map((item: any) => ({ ...item, discount_value: Number(item.discount_value), minimum_order: Number(item.minimum_order) })));'
          for needle in [old_des,old_metrics,old_coupon,old_metric_set,old_coupon_set]:
              if needle not in s: raise SystemExit(f"trecho esperado não encontrado: {needle[:80]}")
          s=s.replace(old_des,new_des,1)
          s=s.replace(old_metrics,new_metrics,1)
          s=s.replace(old_coupon,"",1)
          s=s.replace(old_metric_set,new_metric_set,1)
          s=s.replace(old_coupon_set,new_coupon_set,1)
          p.write_text(s,encoding="utf-8")
      - name: Build Lojista
        run: npm --workspace @clickfood/lojista run build
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "fix: ler métricas e cupons via Edge Function"
          git pull --rebase origin main
          git push origin HEAD:main
