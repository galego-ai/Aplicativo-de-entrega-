name: CLICK-FOOD One-shot Customer Checkout Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-customer-checkout-preview.yml'

permissions:
  contents: write

jobs:
  patch-customer-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar checkout com prévia de frete
        run: python3 scripts/patch_customer_checkout_preview.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cliente/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Melhorar carrinho e prévia de frete no Cliente"
          git push origin main
