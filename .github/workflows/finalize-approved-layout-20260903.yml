name: CLICK-FOOD Finalizar layout aprovado 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-approved-layout-20260903.py'
      - '.github/workflows/finalize-approved-layout-20260903.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remover carrinho inferior legado
        run: python scripts/finalize-approved-layout-20260903.py

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Validar App Cliente
        run: npx tsc --noEmit -p apps/cliente/tsconfig.json

      - name: Validar App Entregador
        run: npx tsc --noEmit -p apps/entregador/tsconfig.json

      - name: Commit e push
        run: |
          git config user.name 'galego-ai'
          git config user.email 'elismarribeiro298@gmail.com'
          git add apps/cliente/App.tsx
          git commit -m 'fix(cliente): manter apenas carrinho flutuante superior'
          git push origin HEAD:main
