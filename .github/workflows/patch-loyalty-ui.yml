name: Patch Loyalty UI

on:
  push:
    paths:
      - '.github/workflows/patch-loyalty-ui.yml'
      - '.github/scripts/patch_loyalty_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply loyalty UI patch
        run: python .github/scripts/patch_loyalty_ui.py
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck Cliente
        run: npx tsc --noEmit -p apps/cliente/tsconfig.json
      - name: Build Lojista
        run: npm run build --workspace apps/lojista
      - name: Commit patch
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git checkout -- package-lock.json apps/lojista/tsconfig.json 2>/dev/null || true
          git add apps/cliente/App.tsx apps/lojista/app/page.tsx
          git commit -m "feat: conectar fidelidade e resgates aos apps" || exit 0
          git pull --rebase origin main
          git push
