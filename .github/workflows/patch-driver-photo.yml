name: Patch Driver Profile Photo

on:
  push:
    paths:
      - '.github/workflows/patch-driver-photo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restrict profile photo to images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/entregador/DriverDocumentsHost.tsx')
          s=p.read_text()
          old='DocumentPicker.getDocumentAsync({type:["image/jpeg","image/png","image/webp","application/pdf"],copyToCacheDirectory:true,multiple:false})'
          new='DocumentPicker.getDocumentAsync({type:type==="PROFILE_PHOTO"?["image/jpeg","image/png","image/webp"]:["image/jpeg","image/png","image/webp","application/pdf"],copyToCacheDirectory:true,multiple:false})'
          if old not in s:
              raise SystemExit('Document picker marker not found')
          s=s.replace(old,new,1)
          old2='<Text style={styles.meta}>JPG, PNG, WEBP ou PDF • máximo de 10 MB por arquivo.</Text>'
          new2='<Text style={styles.meta}>Foto do perfil: JPG, PNG ou WEBP. Demais documentos: JPG, PNG, WEBP ou PDF • máximo de 10 MB por arquivo.</Text>'
          if old2 not in s:
              raise SystemExit('Rules marker not found')
          p.write_text(s.replace(old2,new2,1))
          PY
      - run: npm install --ignore-scripts
      - run: npx tsc --noEmit -p apps/entregador/tsconfig.json
      - name: Commit patch
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/entregador/DriverDocumentsHost.tsx
          git commit -m "fix: exigir imagem na foto do perfil do entregador" || exit 0
          git push
