name: Patch Stale Cash Alert

on:
  push:
    paths:
      - .github/workflows/patch-stale-cash-alert.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add stale cash session alert
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('apps/lojista/app/page.tsx')
          text = path.read_text(encoding='utf-8')

          needle = '''  const financeSummary = useMemo(() => finance.reduce((acc, item) => {
    if (item.direction === "CREDIT") acc.credit += item.amount;
    else acc.debit += item.amount;
    return acc;
  }, { credit: 0, debit: 0 }), [finance]);
'''
          replacement = needle + '''  const staleCashSession = useMemo(() => !!cashSession && Date.now() - new Date(cashSession.opened_at).getTime() >= 24 * 60 * 60 * 1000, [cashSession?.id, cashSession?.opened_at]);
'''
          if needle not in text:
              raise SystemExit('financeSummary anchor not found')
          text = text.replace(needle, replacement, 1)

          message_needle = '''        {message && <div className="notice">{message}</div>}
'''
          message_replacement = message_needle + '''        {staleCashSession && <div className="notice" style={{background:"#fff1cc",border:"1px solid #e4b600",color:"#5c4900"}}><b>ATENÇÃO: caixa aberto há mais de 24 horas.</b> Confira as movimentações e feche o caixa quando encerrar o turno. O CLICK-FOOD não fecha o caixa automaticamente para não alterar sua conferência.</div>}
'''
          if message_needle not in text:
              raise SystemExit('notice anchor not found')
          text = text.replace(message_needle, message_replacement, 1)

          cash_needle = '''        <div><small>CAIXA</small><h2>{cashSession ? "Caixa 01 aberto" : "Caixa fechado"}</h2>{cashSession && <p>Saldo inicial: {brl(cashSession.opening_balance)}</p>}</div>
'''
          cash_replacement = '''        <div><small>CAIXA</small><h2>{cashSession ? "Caixa 01 aberto" : "Caixa fechado"}</h2>{cashSession && <p>Saldo inicial: {brl(cashSession.opening_balance)} • aberto em {dateTime(cashSession.opened_at)}</p>}{staleCashSession && <p style={{color:"#9a6400",fontWeight:900}}>Caixa aberto há mais de 24h — confira antes de continuar o turno.</p>}</div>
'''
          if cash_needle not in text:
              raise SystemExit('cash panel anchor not found')
          text = text.replace(cash_needle, cash_replacement, 1)

          path.write_text(text, encoding='utf-8')
      - run: npm ci
      - run: npm run build:lojista
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "feat: alertar caixa aberto por mais de 24 horas"
          git push
