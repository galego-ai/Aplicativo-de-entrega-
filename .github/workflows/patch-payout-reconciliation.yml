name: Patch payout reconciliation
on:
  push:
    paths:
      - .github/workflows/patch-payout-reconciliation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch uncertain 409 handling
        shell: python
        run: |
          from pathlib import Path

          action = Path('supabase/functions/efi-payout-action/index.ts')
          s = action.read_text()
          old = '''  if(result.status===409){const query=await reconcile(client,access,activeId);if(query.ok)return Response.json({ok:true,reused:true,payout:query.settled,providerStatus:String(query.data?.status??"")});result=query;}\n  if(result.ok){'''
          new = '''  if(result.status===409){\n   const query=await reconcile(client,access,activeId);\n   if(query.ok)return Response.json({ok:true,reused:true,payout:query.settled,providerStatus:String(query.data?.status??"")});\n   if(query.status===404){const uncertain=await sync(activeId,"UNKNOWN",null,query.data,"Conflito no envio; aguardando reconciliação pelo mesmo idEnvio");return Response.json({ok:false,error:"EFI_PAYOUT_CONFIRMATION_PENDING",uncertain:true,payout:uncertain,providerStatus:409},{status:202});}\n   result=query;\n  }\n  if(result.ok){'''
          if old not in s:
              raise SystemExit('action marker not found')
          action.write_text(s.replace(old,new,1))

          worker = Path('supabase/functions/efi-payout-worker/index.ts')
          s = worker.read_text()
          old = '''  if(result.status===409){result=await api(client,access,`/v2/gn/pix/enviados/id-envio/${encodeURIComponent(idEnvio)}`,{method:"GET"});}\n  if(result.ok){'''
          new = '''  if(result.status===409){\n   const query=await api(client,access,`/v2/gn/pix/enviados/id-envio/${encodeURIComponent(idEnvio)}`,{method:"GET"});\n   if(query.ok)result=query;\n   else if(query.status===404){await sync("UNKNOWN",null,query.data,"Conflito no envio; aguardando reconciliação pelo mesmo idEnvio");return Response.json({ok:true,pending:true,providerStatus:409});}\n   else result=query;\n  }\n  if(result.ok){'''
          if old not in s:
              raise SystemExit('worker marker not found')
          worker.write_text(s.replace(old,new,1))
      - name: Commit patch
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add supabase/functions/efi-payout-action/index.ts supabase/functions/efi-payout-worker/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preservar repasse Efí incerto até reconciliação"
          git push
