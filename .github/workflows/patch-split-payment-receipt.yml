name: Patch split payment receipt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-split-payment-receipt.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch receipt UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lojista/app/recibo/page.tsx')
          s=p.read_text()
          old_type='type Receipt={order:any;store:any;customer:any;address:any;items:any[];payment:any;delivery:any};'
          new_type='type Receipt={order:any;store:any;customer:any;address:any;items:any[];payments?:any[];payment:any;delivery:any};'
          if old_type not in s:
              raise SystemExit('Receipt type marker not found')
          s=s.replace(old_type,new_type,1)
          old_const=' const r=receipt,o=r.order;'
          new_const=' const r=receipt,o=r.order;const receiptPayments=r.payments?.length?r.payments:r.payment?[r.payment]:[];'
          if old_const not in s:
              raise SystemExit('receipt const marker not found')
          s=s.replace(old_const,new_const,1)
          old_section='   <section style={s.box}><span style={s.label}>Pagamento</span><div><b>{paymentLabel[r.payment?.method]??r.payment?.method??"Não informado"}</b> • {r.payment?.status??o.payment_status}{r.payment?.provider?` • ${r.payment.provider}`:""}</div>{r.payment?.paidAt&&<div style={s.small}>Pago em {dt(r.payment.paidAt)}</div>}{r.payment?.transactionId&&<div style={s.code}>Ref.: {r.payment.transactionId}</div>}</section>'
          new_section='   <section style={s.box}><span style={s.label}>{receiptPayments.length>1?"Pagamentos":"Pagamento"}</span>{receiptPayments.length?receiptPayments.map((payment:any,index:number)=><div key={`${payment.method}-${index}`} style={index?{marginTop:10,paddingTop:10,borderTop:"1px dashed #ddd"}:undefined}><div><b>{paymentLabel[payment.method]??payment.method??"Não informado"}</b> • {brl(Number(payment.amount??0))} • {payment.status??o.payment_status}{payment.provider?` • ${payment.provider}`:""}</div>{payment.paidAt&&<div style={s.small}>Pago em {dt(payment.paidAt)}</div>}{payment.transactionId&&<div style={s.code}>Ref.: {payment.transactionId}</div>}</div>):<div><b>Não informado</b> • {o.payment_status}</div>}</section>'
          if old_section not in s:
              raise SystemExit('payment section marker not found')
          s=s.replace(old_section,new_section,1)
          p.write_text(s)
          PY
      - name: Validate Lojista build
        run: |
          npm install --ignore-scripts
          npm run build:lojista
      - name: Commit patch
        run: |
          git config user.name 'galego-ai'
          git config user.email 'elismarribeiro298@gmail.com'
          git rm .github/workflows/patch-split-payment-receipt.yml
          git add apps/lojista/app/recibo/page.tsx
          git commit -m 'fix: exibir pagamentos divididos no recibo'
          git push
