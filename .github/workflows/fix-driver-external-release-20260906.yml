name: CLICK-FOOD Corrigir Liberação Externa Entregador

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-driver-external-release-20260906.yml'
      - '.github/scripts/patch-driver-external-release-20260906.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependências
        run: npm ci --include=dev
      - name: Aplicar correção
        run: node .github/scripts/patch-driver-external-release-20260906.mjs
      - name: Validar TypeScript
        run: npx tsc -p apps/entregador/tsconfig.json --noEmit
      - name: Commit
        run: |
          git config user.name clickfood-bot
          git config user.email clickfood-bot@users.noreply.github.com
          git add apps/entregador/App.tsx
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
            exit 0
          fi
          git commit -m 'fix(entregador): atualizar tela após liberação pela Loja ou Matriz'
          git push
