name: CLICK-FOOD Apps Android Local Build
# Build local de contingência quando a cota EAS cloud estiver indisponível.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mobile-apks-local.yml'
      - 'apps/cliente/**'
      - 'apps/entregador/**'
      - 'package-lock.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: click-food-local-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-local:
    name: APK Local ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cliente
            label: Cliente
            package: br.com.clickfood.cliente
            filename: CLICK-FOOD-Cliente.apk
            artifact: CLICK-FOOD-Cliente-APK-Local
            fallback_artifact_id: 9901330763
          - app: entregador
            label: Entregador
            package: br.com.clickfood.entregador
            filename: CLICK-FOOD-Entregador.apk
            artifact: CLICK-FOOD-Entregador-APK-Local
            fallback_artifact_id: 9901142581
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Validar projeto Expo
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN não configurado."; exit 1; }
          npx expo install --check
          npx --yes eas-cli@latest whoami >/dev/null
          npx --yes eas-cli@latest project:info --non-interactive

      - name: Recuperar Google Maps do APK anterior se necessário
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_MAPS_API_KEY:-}" ] || [ -n "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ] || [ -n "${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}" ] || [ -n "${EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY:-}" ]; then
            echo 'Configuração protegida do Google Maps já disponível.'
            exit 0
          fi

          TMP="$RUNNER_TEMP/maps-fallback-${{ matrix.app }}"
          mkdir -p "$TMP"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ matrix.fallback_artifact_id }}/zip" \
            -o "$TMP/prior.zip"
          unzip -q "$TMP/prior.zip" -d "$TMP/unpacked"
          PRIOR_APK="$(find "$TMP/unpacked" -type f -name '*.apk' | head -n 1 || true)"
          test -n "$PRIOR_APK" || { echo 'APK anterior não encontrado no artefato de fallback.'; exit 1; }

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -n "$SDK_ROOT" || { echo 'Android SDK não localizado.'; exit 1; }
            APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$APKANALYZER" || { echo 'apkanalyzer não encontrado no runner.'; exit 1; }
          "$APKANALYZER" manifest print "$PRIOR_APK" > "$TMP/manifest.xml"

          KEY="$(python - "$TMP/manifest.xml" <<'PY'
import re, sys
text = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
for tag in re.findall(r'<meta-data\b[^>]*>', text, flags=re.S):
    if 'com.google.android.geo.API_KEY' not in tag:
        continue
    match = re.search(r'android:value="([^"]+)"', tag)
    if match:
        print(match.group(1))
        break
PY
)"
          test -n "$KEY" || { echo 'Chave Google Maps não encontrada no APK anterior.'; exit 1; }
          test "$KEY" != 'CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED' || { echo 'APK anterior contém apenas fallback do Maps.'; exit 1; }
          echo "::add-mask::$KEY"
          {
            echo "GOOGLE_MAPS_API_KEY=$KEY"
            echo "GOOGLE_MAPS_ANDROID_API_KEY=$KEY"
            echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$KEY"
            echo "EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY=$KEY"
          } >> "$GITHUB_ENV"
          rm -rf "$TMP"
          echo 'Google Maps recuperado de artefato anterior sem expor a chave.'

      - name: Validar configuração protegida Google Maps
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ] && [ -z "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ] && [ -z "${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}" ] && [ -z "${EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY:-}" ]; then
            echo 'Nenhuma configuração válida do Google Maps está disponível.'
            exit 1
          fi
          echo 'Configuração protegida do Google Maps disponível para o build local.'

      - name: Compilar APK localmente
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/eas-local-${{ matrix.app }}"
          mkdir -p "$OUT"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$OUT"
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive

          APK="$(find "$OUT" -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find . -type f -name '*.apk' | head -n 1 || true)"
          fi
          test -n "$APK" || { echo 'APK não encontrado após o build local.'; find "$OUT" -maxdepth 3 -type f -print || true; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/${{ matrix.filename }}"
          test -s "$GITHUB_WORKSPACE/artifacts/${{ matrix.filename }}"
          unzip -tq "$GITHUB_WORKSPACE/artifacts/${{ matrix.filename }}" >/dev/null

      - name: Garantir Google Maps real no APK local
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/${{ matrix.filename }}"
          MANIFEST_XML="$RUNNER_TEMP/${{ matrix.app }}-AndroidManifest.xml"
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -n "$SDK_ROOT" || { echo 'Android SDK não localizado.'; exit 1; }
            APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$APKANALYZER" || { echo 'apkanalyzer não encontrado no runner.'; exit 1; }
          "$APKANALYZER" manifest print "$APK" > "$MANIFEST_XML"
          grep -q 'com.google.android.geo.API_KEY' "$MANIFEST_XML" || {
            echo 'Metadado do Google Maps não encontrado no APK local.'
            exit 1
          }
          if grep -q 'CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED' "$MANIFEST_XML"; then
            echo 'APK local contém a configuração fallback do Google Maps.'
            exit 1
          fi
          rm -f "$MANIFEST_XML"
          echo 'Google Maps real confirmado no APK local sem expor a chave.'

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 30
