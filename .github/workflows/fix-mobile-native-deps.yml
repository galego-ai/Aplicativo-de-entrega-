name: CLICK-FOOD Fix Mobile Native Dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-native-deps.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Alinhar Cliente com Expo SDK 57
        run: |
          npm install -w @clickfood/cliente \
            @react-native-async-storage/async-storage@2.2.0 \
            expo@~57.0.19 \
            expo-linking@~57.0.9 \
            expo-location@~57.0.14 \
            expo-notifications@~57.0.15
          npm install -D -w @clickfood/cliente \
            @types/react@~19.2.4 \
            typescript@~6.0.3
      - name: Alinhar Entregador com Expo SDK 57
        run: |
          npm install -w @clickfood/entregador \
            @react-native-async-storage/async-storage@2.2.0 \
            expo@~57.0.19 \
            expo-linking@~57.0.9 \
            expo-location@~57.0.14 \
            expo-notifications@~57.0.15 \
            expo-task-manager@~57.0.14
          npm install -D -w @clickfood/entregador \
            @types/react@~19.2.4 \
            typescript@~6.0.3
      - name: Validar versões esperadas pelo Expo
        run: |
          (cd apps/cliente && npx expo install --check)
          (cd apps/entregador && npx expo install --check)
      - name: Conferir alterações
        run: git diff -- apps/cliente/package.json apps/entregador/package.json package-lock.json
      - name: Commitar correção
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/cliente/package.json apps/entregador/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git commit -m "fix(mobile): compatibilizar apps com Expo SDK 57"
          git push origin HEAD:main
