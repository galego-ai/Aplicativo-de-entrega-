name: Patch lojista order details

on:
  push:
    paths:
      - '.github/workflows/patch-lojista-order-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch order queue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/lojista/app/page.tsx')
          text = path.read_text()
          import_line = 'import StoreSetup from "./StoreSetup";\n'
          new_import = import_line + 'import OrderDetailsPanel from "./OrderDetailsPanel";\n'
          if 'import OrderDetailsPanel from "./OrderDetailsPanel";' not in text:
              if import_line not in text:
                  raise SystemExit('StoreSetup import not found')
              text = text.replace(import_line, new_import, 1)
          marker = '            <div className="queueActions">'
          detail = '            <OrderDetailsPanel orderId={order.id} />\n' + marker
          if '<OrderDetailsPanel orderId={order.id} />' not in text:
              if marker not in text:
                  raise SystemExit('queueActions marker not found')
              text = text.replace(marker, detail, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/patch-lojista-order-details.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lojista/app/page.tsx apps/lojista/app/OrderDetailsPanel.tsx .github/workflows/patch-lojista-order-details.yml || true
          git commit -m "feat: exibir detalhes completos do pedido no lojista"
          git pull --rebase origin main
          git push origin HEAD:main
