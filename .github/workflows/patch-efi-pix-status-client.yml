name: Patch Efi Pix Status Client
on:
  push:
    paths:
      - '.github/workflows/patch-efi-pix-status-client.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aplicar consulta de status Efí
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/cliente/App.tsx')
          s=p.read_text()
          old='''  async function refreshPix(orderId:string){\n    setPixBusy(true);\n    const{data,error}=await supabase.functions.invoke("efi-pix-create",{body:{orderId}});\n    if(error||data?.error||!data?.charge?.brcode){setMessage("Não foi possível gerar o PIX agora. Tente novamente.");setPixBusy(false);return false;}\n    setPixCharge({orderId,txid:data.charge.txid,brcode:data.charge.brcode,status:data.charge.status,expires_at:data.charge.expires_at});\n    setMessage("PIX atualizado. Assim que o pagamento for confirmado, o pedido seguirá automaticamente para a loja.");setPixBusy(false);return true;\n  }\n'''
          new='''  async function refreshPix(orderId:string){\n    setPixBusy(true);\n    const statusResult=await supabase.functions.invoke("efi-pix-status",{body:{orderId}});\n    if(!statusResult.error&&statusResult.data?.paid){\n      setPixCharge(null);setMessage("Pagamento PIX confirmado! Seu pedido foi enviado para a loja.");await loadOrders();setPixBusy(false);return true;\n    }\n    const{data,error}=await supabase.functions.invoke("efi-pix-create",{body:{orderId}});\n    if(error||data?.error||!data?.charge?.brcode){setMessage("Não foi possível consultar ou gerar o PIX agora. Tente novamente.");setPixBusy(false);return false;}\n    setPixCharge({orderId,txid:data.charge.txid,brcode:data.charge.brcode,status:data.charge.status,expires_at:data.charge.expires_at});\n    setMessage("PIX atualizado. Assim que o pagamento for confirmado, o pedido seguirá automaticamente para a loja.");setPixBusy(false);return true;\n  }\n'''
          if old not in s: raise SystemExit('refreshPix esperado não encontrado')
          p.write_text(s.replace(old,new,1))
          PY
          npm install --ignore-scripts
          npx tsc --noEmit -p apps/cliente/tsconfig.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cliente/App.tsx
          git rm .github/workflows/patch-efi-pix-status-client.yml
          git commit -m "feat: reconciliar PIX Efí no app cliente"
          git push
