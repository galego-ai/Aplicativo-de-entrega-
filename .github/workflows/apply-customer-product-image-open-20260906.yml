name: CLICK-FOOD Abrir Produto Pela Imagem Cliente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-product-image-open-20260906.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --include=dev
      - name: Aplicar ajuste
        run: node .github/scripts/patch-customer-product-image-open-20260906.mjs
      - name: Validar TypeScript
        run: npx tsc -p apps/cliente/tsconfig.json --noEmit
      - name: Validar comportamento
        run: grep -Fq 'style={styles.productImageButton} onPress={()=>{setSelectedProduct(product);setMessage("");}}>' apps/cliente/App.tsx
      - name: Commit
        run: |
          git config user.name clickfood-bot
          git config user.email clickfood-bot@users.noreply.github.com
          git add apps/cliente/App.tsx
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git commit -m 'fix(cliente): abrir detalhes ao tocar na imagem do produto'
          git push
