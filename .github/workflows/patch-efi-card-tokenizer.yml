name: Patch Efi Card Tokenizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-efi-card-tokenizer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fixar versão oficial da tokenização Efí
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/cliente/EfiCardPayment.tsx')
          s = p.read_text()
          old = 'https://cdn.jsdelivr.net/gh/efipay/js-payment-token-efi/dist/payment-token-efi-umd.min.js'
          new = 'https://cdn.jsdelivr.net/npm/payment-token-efi@3.4.1/dist/payment-token-efi-umd.min.js'
          if old not in s:
              raise SystemExit('URL mutável esperada não encontrada')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/patch-efi-card-tokenizer.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "click-food-bot"
          git config user.email "click-food-bot@users.noreply.github.com"
          git add apps/cliente/EfiCardPayment.tsx .github/workflows/patch-efi-card-tokenizer.yml
          git commit -m "security: fixar tokenização Efí na versão 3.4.1"
          git push origin main
