name: Patch driver alert incidents
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch App Entregador
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/entregador/App.tsx')
          s=p.read_text()

          old='  Alert, Modal, Pressable, SafeAreaView, ScrollView, StatusBar, StyleSheet,\n  Text, TextInput, View,\n'
          new='  Alert, Modal, Pressable, SafeAreaView, ScrollView, StatusBar, StyleSheet, Vibration,\n  Text, TextInput, View,\n'
          assert old in s, 'import target missing'
          s=s.replace(old,new,1)

          old='  const [history,setHistory]=useState<HistoryItem[]>([]); const [code,setCode]=useState(""); const [message,setMessage]=useState(""); const [loading,setLoading]=useState(true);\n'
          new='  const [history,setHistory]=useState<HistoryItem[]>([]); const [code,setCode]=useState(""); const [message,setMessage]=useState(""); const [loading,setLoading]=useState(true);\n  const [incidentModal,setIncidentModal]=useState(false); const [incidentReason,setIncidentReason]=useState(""); const [incidentBusy,setIncidentBusy]=useState(false);\n'
          assert old in s, 'state target missing'
          s=s.replace(old,new,1)

          marker='  useEffect(()=>{if(!driver?.online||driver.status!=="ACTIVE") return; const timer=setInterval(()=>{loadOffers();loadActive();},6000);loadOffers();loadActive();return()=>clearInterval(timer);},[driver?.online,driver?.status]);\n'
          insert=marker+'  useEffect(()=>{if(!offer){Vibration.cancel();return;}Vibration.vibrate([0,650,350,650,350,950],true);return()=>Vibration.cancel();},[offer?.id]);\n'
          assert marker in s, 'offer effect target missing'
          s=s.replace(marker,insert,1)

          old='  async function deliveryAction(action:string){if(!active)return;setMessage("");const body:any={deliveryId:active.id,action};if(action==="CONFIRM_PICKUP"||action==="CONFIRM_DELIVERY")body.code=code;const {data,error}=await supabase.functions.invoke("driver-delivery-action",{body});if(error||data?.error){setMessage(data?.error==="INVALID_DELIVERY_CODE"?"Código incorreto.":"Não foi possível atualizar a entrega.");return;}setCode("");await loadActive();if(action==="CONFIRM_DELIVERY"){await loadHistory();setMessage("Entrega concluída com sucesso.");}}\n'
          new=old+'  async function reportDeliveryProblem(kind:"CUSTOMER_UNAVAILABLE"|"INCIDENT"){if(!active||incidentBusy)return;const reason=kind==="INCIDENT"?incidentReason.trim():incidentReason.trim()||"Cliente não localizado no endereço informado";if(kind==="INCIDENT"&&reason.length<5){setMessage("Descreva rapidamente o problema antes de enviar.");return;}setIncidentBusy(true);setMessage("");const action=kind==="INCIDENT"?"REPORT_INCIDENT":"REPORT_CUSTOMER_UNAVAILABLE";const{data,error}=await supabase.functions.invoke("driver-delivery-action",{body:{deliveryId:active.id,action,reason}});setIncidentBusy(false);if(error||data?.error){setMessage(data?.error==="CUSTOMER_UNAVAILABLE_REQUIRES_ARRIVAL"?"Confirme sua chegada ao cliente antes de informar que ele não foi localizado.":"Não foi possível acionar o suporte agora. Tente novamente.");return;}setIncidentModal(false);setIncidentReason("");await loadActive();setMessage(kind==="INCIDENT"?"Incidente registrado. O suporte e a loja foram avisados.":"Cliente não localizado. O suporte e a loja foram avisados.");}\n'
          assert old in s, 'delivery action target missing'
          s=s.replace(old,new,1)

          old='{active&&<View style={styles.deliveryCard}><Text style={styles.deliveryBadge}>PEDIDO #{active.orderNumber}</Text><Text style={styles.deliveryTitle}>{active.status.includes("CUSTOMER")||active.status==="PICKUP_CONFIRMED"?"Entrega ao cliente":active.pickup.storeName}</Text><Text style={styles.deliveryMeta}>Status: {active.status}</Text>{active.destination&&active.status!=="DRIVER_ASSIGNED"&&active.status!=="DRIVER_TO_STORE"&&active.status!=="DRIVER_AT_STORE"&&<Text style={styles.address}>{active.destination.street}, {active.destination.number??"s/n"}{active.destination.district?` • ${active.destination.district}`:""}</Text>}{needsCode&&<TextInput style={styles.codeInput} placeholder="Código de 4 dígitos" keyboardType="number-pad" maxLength={4} value={code} onChangeText={setCode}/>} {nextAction&&<Pressable style={styles.actionButton} onPress={()=>deliveryAction(nextAction[0])}><Text style={styles.actionText}>{nextAction[1]}</Text></Pressable>}<Text style={styles.earning}>Ganho desta entrega: {brl(active.earning)}</Text></View>}\n'
          new='{active&&<View style={styles.deliveryCard}><Text style={styles.deliveryBadge}>PEDIDO #{active.orderNumber}</Text><Text style={styles.deliveryTitle}>{active.status.includes("CUSTOMER")||active.status==="PICKUP_CONFIRMED"?"Entrega ao cliente":active.pickup.storeName}</Text><Text style={styles.deliveryMeta}>Status: {active.status}</Text>{active.destination&&active.status!=="DRIVER_ASSIGNED"&&active.status!=="DRIVER_TO_STORE"&&active.status!=="DRIVER_AT_STORE"&&<Text style={styles.address}>{active.destination.street}, {active.destination.number??"s/n"}{active.destination.district?` • ${active.destination.district}`:""}</Text>}{needsCode&&<TextInput style={styles.codeInput} placeholder="Código de 4 dígitos" keyboardType="number-pad" maxLength={4} value={code} onChangeText={setCode}/>} {nextAction&&<Pressable style={styles.actionButton} onPress={()=>deliveryAction(nextAction[0])}><Text style={styles.actionText}>{nextAction[1]}</Text></Pressable>}{active.status==="DRIVER_AT_CUSTOMER"&&<Pressable style={styles.problemSecondary} onPress={()=>Alert.alert("Cliente não encontrado","Confirme apenas se você já está no endereço e tentou localizar o cliente.",[{text:"VOLTAR",style:"cancel"},{text:"CONFIRMAR",style:"destructive",onPress:()=>reportDeliveryProblem("CUSTOMER_UNAVAILABLE")}])}><Text style={styles.problemSecondaryText}>CLIENTE NÃO ENCONTRADO</Text></Pressable>}{["DRIVER_ASSIGNED","DRIVER_TO_STORE","DRIVER_AT_STORE","PICKUP_CONFIRMED","DRIVER_TO_CUSTOMER","DRIVER_AT_CUSTOMER","RETURN_REQUIRED"].includes(active.status)&&<Pressable style={styles.problemButton} onPress={()=>{setIncidentReason("");setIncidentModal(true)}}><Text style={styles.problemText}>REPORTAR PROBLEMA</Text></Pressable>}{["CUSTOMER_UNAVAILABLE","INCIDENT","RETURN_REQUIRED"].includes(active.status)&&<Text style={styles.supportActive}>Suporte acionado. Aguarde orientação no aplicativo.</Text>}<Text style={styles.earning}>Ganho desta entrega: {brl(active.earning)}</Text></View>}\n'
          assert old in s, 'active delivery card target missing'
          s=s.replace(old,new,1)

          old='<Modal visible={!!offer} transparent animationType="fade"><View style={styles.modalBackdrop}>{offer&&<View style={styles.offerCard}><View style={styles.offerHeader}><Text style={styles.offerLabel}>NOVA ENTREGA</Text><Text style={styles.timerText}>{Math.max(0,Math.ceil((new Date(offer.expiresAt).getTime()-Date.now())/1000))}s</Text></View><Text style={styles.offerStore}>{offer.storeName}</Text><View style={styles.offerRoute}><View><Text style={styles.offerSmall}>ATÉ A LOJA</Text><Text style={styles.offerBig}>{offer.pickupDistanceKm==null?"—":`${offer.pickupDistanceKm.toFixed(1)} km`}</Text></View><Text style={styles.arrow}>→</Text><View><Text style={styles.offerSmall}>ENTREGA</Text><Text style={styles.offerBig}>{offer.deliveryDistanceKm==null?"—":`${offer.deliveryDistanceKm.toFixed(1)} km`}</Text></View></View><Text style={styles.offerSmall}>SEU GANHO</Text><Text style={styles.offerAmount}>{brl(offer.earning)}</Text><View style={styles.offerActions}><Pressable style={styles.reject} onPress={rejectOffer}><Text style={styles.rejectText}>RECUSAR</Text></Pressable><Pressable style={styles.accept} onPress={acceptOffer}><Text style={styles.acceptText}>ACEITAR</Text></Pressable></View></View>}</View></Modal></SafeAreaView>;\n'
          new='<Modal visible={!!offer} transparent animationType="fade"><View style={styles.modalBackdrop}>{offer&&<View style={styles.offerCard}><View style={styles.offerHeader}><Text style={styles.offerLabel}>NOVA ENTREGA</Text><Text style={styles.timerText}>{Math.max(0,Math.ceil((new Date(offer.expiresAt).getTime()-Date.now())/1000))}s</Text></View><Text style={styles.offerStore}>{offer.storeName}</Text><View style={styles.offerRoute}><View><Text style={styles.offerSmall}>ATÉ A LOJA</Text><Text style={styles.offerBig}>{offer.pickupDistanceKm==null?"—":`${offer.pickupDistanceKm.toFixed(1)} km`}</Text></View><Text style={styles.arrow}>→</Text><View><Text style={styles.offerSmall}>ENTREGA</Text><Text style={styles.offerBig}>{offer.deliveryDistanceKm==null?"—":`${offer.deliveryDistanceKm.toFixed(1)} km`}</Text></View></View><Text style={styles.offerSmall}>SEU GANHO</Text><Text style={styles.offerAmount}>{brl(offer.earning)}</Text><View style={styles.offerActions}><Pressable style={styles.reject} onPress={rejectOffer}><Text style={styles.rejectText}>RECUSAR</Text></Pressable><Pressable style={styles.accept} onPress={acceptOffer}><Text style={styles.acceptText}>ACEITAR</Text></Pressable></View></View>}</View></Modal><Modal visible={incidentModal} transparent animationType="fade" onRequestClose={()=>!incidentBusy&&setIncidentModal(false)}><View style={styles.modalBackdrop}><View style={styles.incidentCard}><Text style={styles.incidentTitle}>Reportar problema</Text><Text style={styles.incidentHint}>Descreva o que aconteceu. O suporte e a loja receberão o chamado.</Text><TextInput style={styles.incidentInput} placeholder="Ex.: pneu furou, acidente, problema no pedido..." multiline value={incidentReason} onChangeText={setIncidentReason}/><View style={styles.offerActions}><Pressable style={styles.reject} disabled={incidentBusy} onPress={()=>setIncidentModal(false)}><Text style={styles.rejectText}>VOLTAR</Text></Pressable><Pressable style={[styles.accept,incidentBusy&&styles.disabled]} disabled={incidentBusy} onPress={()=>reportDeliveryProblem("INCIDENT")}><Text style={styles.acceptText}>{incidentBusy?"ENVIANDO...":"ENVIAR"}</Text></Pressable></View></View></View></Modal></SafeAreaView>;\n'
          assert old in s, 'modal target missing'
          s=s.replace(old,new,1)

          old='  actionButton:{backgroundColor:"#f4c400",padding:14,borderRadius:13,alignItems:"center",marginTop:12},actionText:{fontWeight:"900"},earning:{fontWeight:"900",marginTop:13,color:"#8c7000"},\n'
          new='  actionButton:{backgroundColor:"#f4c400",padding:14,borderRadius:13,alignItems:"center",marginTop:12},actionText:{fontWeight:"900"},problemButton:{borderWidth:1,borderColor:"#b42318",padding:12,borderRadius:13,alignItems:"center",marginTop:9},problemText:{fontWeight:"900",color:"#b42318"},problemSecondary:{borderWidth:1,borderColor:"#a15c00",padding:12,borderRadius:13,alignItems:"center",marginTop:9},problemSecondaryText:{fontWeight:"900",color:"#8a5200"},supportActive:{backgroundColor:"#fff4c6",color:"#6d5900",padding:10,borderRadius:10,marginTop:10,fontWeight:"800",fontSize:11},earning:{fontWeight:"900",marginTop:13,color:"#8c7000"},\n  incidentCard:{backgroundColor:"#fff",borderRadius:22,padding:20,width:"90%",maxWidth:460},incidentTitle:{fontSize:22,fontWeight:"900"},incidentHint:{color:"#666",fontSize:12,lineHeight:17,marginTop:6,marginBottom:12},incidentInput:{minHeight:100,borderWidth:1,borderColor:"#ddd",borderRadius:13,padding:12,textAlignVertical:"top",marginBottom:4},\n'
          assert old in s, 'style target missing'
          s=s.replace(old,new,1)

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/entregador/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: adicionar alerta e incidentes no app entregador"
          git push
