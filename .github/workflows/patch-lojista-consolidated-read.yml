name: Patch Lojista Consolidated Read

on:
  push:
    paths:
      - .github/workflows/patch-lojista-consolidated-read.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Replace store data loader
        shell: python {0}
        env:
          REPLACEMENT_B64: 
        run: |
          import base64, os
          from pathlib import Path
          path = Path('apps/lojista/app/page.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('  async function loadStoreData(currentStore = store) {')
          end = text.index('  useEffect(() => {', start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
      - run: npm ci
      - run: npm run build:lojista
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "perf: consolidar consultas do painel lojista"
          git push
