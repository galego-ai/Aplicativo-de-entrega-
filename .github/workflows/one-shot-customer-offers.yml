name: CLICK-FOOD One-shot Customer Offers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-customer-offers.yml'

permissions:
  contents: write

jobs:
  patch-customer-offers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar ofertas e categorias visuais
        run: python3 scripts/patch_customer_offers_categories.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cliente/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Destacar ofertas e categorias visuais no Cliente"
          git push origin main
