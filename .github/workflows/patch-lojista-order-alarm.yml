name: Patch lojista order alarm
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch page Lojista
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text()
          old='import OrderDetailsPanel from "./OrderDetailsPanel";\n'
          new=old+'import NewOrderAlarm from "./NewOrderAlarm";\n'
          assert old in s and 'NewOrderAlarm from' not in s, 'import target missing or already patched'
          s=s.replace(old,new,1)

          old='  const marketplaceOrders = useMemo(() => orders.filter((order) => order.source !== "POS"), [orders]);\n'
          new=old+'  const waitingStoreOrders = useMemo(() => marketplaceOrders.filter((order) => order.status === "WAITING_STORE").length, [marketplaceOrders]);\n'
          assert old in s, 'orders memo target missing'
          s=s.replace(old,new,1)

          old='  return (\n    <main className="app">\n'
          new='  return (\n    <main className="app">\n      <NewOrderAlarm count={waitingStoreOrders} />\n'
          assert old in s, 'main return target missing'
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Build Lojista
        run: |
          npm install
          npm run build --workspace=@clickfood/lojista
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lojista/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrar alarme persistente de novos pedidos no lojista"
          git push
