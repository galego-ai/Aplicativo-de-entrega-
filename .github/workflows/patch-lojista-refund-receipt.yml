name: Patch lojista refund receipt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-lojista-refund-receipt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch Lojista
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('const refundLabels: Record<string,string> = { PENDING:"Estorno solicitado", PROCESSING:"Estorno em processamento", COMPLETED:"PIX devolvido", FAILED:"Falha no estorno", CANCELLED:"Estorno cancelado" };',
             'const refundLabels: Record<string,string> = { PENDING:"Estorno solicitado", PROCESSING:"Estorno em processamento", COMPLETED:"Pagamento devolvido", FAILED:"Falha no estorno", CANCELLED:"Estorno cancelado" };'),
            ('.in("order_id", orderIds).eq("method", "PIX")', '.in("order_id", orderIds).in("method", ["PIX","CREDIT_CARD"])'),
            ('setMessage(status==="COMPLETED"?"Pedido recusado e PIX devolvido ao cliente.":status==="FAILED"?"Pedido recusado. A devolução PIX falhou e precisa ser reconciliada.":"Pedido recusado. A devolução PIX foi solicitada e está em processamento.");',
             'setMessage(status==="COMPLETED"?"Pedido recusado e pagamento devolvido ao cliente.":status==="FAILED"?"Pedido recusado. A devolução do pagamento falhou e precisa ser reconciliada.":"Pedido recusado. A devolução do pagamento foi solicitada e está em processamento.");'),
            ('supabase.functions.invoke("efi-pix-refund", { body: { orderId: order.id, reason: "Reconciliação de estorno pelo Painel Lojista" } })',
             'supabase.functions.invoke("payment-refund", { body: { orderId: order.id, reason: "Reconciliação de estorno pelo Painel Lojista" } })'),
            ('if (error || data?.error) setMessage("Não foi possível consultar a devolução PIX agora.");',
             'if (error || data?.error) setMessage("Não foi possível consultar a devolução do pagamento agora.");'),
            ('setMessage(status==="COMPLETED"?"PIX devolvido ao cliente.":status==="FAILED"?"A devolução falhou na Efí e pode ser tentada novamente.":"A devolução continua em processamento.");',
             'setMessage(status==="COMPLETED"?"Pagamento devolvido ao cliente.":status==="FAILED"?"A devolução falhou e pode ser tentada novamente.":"A devolução continua em processamento.");'),
            ('"Consultar estorno PIX"', '"Consultar estorno"'),
            ('<nav>{tabs.map((item) => <button key={item} onClick={() => setTab(item)} className={tab === item ? "active" : ""}>{item}</button>)}</nav><a href="/entregadores" style={{display:"block",margin:"10px 0",padding:"12px 14px",borderRadius:10,background:"#f4c400",color:"#111",fontWeight:900,textDecoration:"none",textAlign:"center"}}>Atribuir entregador</a>',
             '<nav>{tabs.map((item) => <button key={item} onClick={() => setTab(item)} className={tab === item ? "active" : ""}>{item}</button>)}</nav><a href="/entregadores" style={{display:"block",margin:"10px 0",padding:"12px 14px",borderRadius:10,background:"#f4c400",color:"#111",fontWeight:900,textDecoration:"none",textAlign:"center"}}>Atribuir entregador</a><a href="/recibos" style={{display:"block",margin:"10px 0",padding:"12px 14px",borderRadius:10,background:"#fff",border:"1px solid #d8d8d8",color:"#111",fontWeight:900,textDecoration:"none",textAlign:"center"}}>Recibos / imprimir</a>')
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('pattern missing: '+old[:100])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm install --ignore-scripts
      - run: npm run build --workspace=@clickfood/lojista
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/patch-lojista-refund-receipt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unificar estornos e restaurar recibos no lojista'
          git pull --rebase origin main
          git push origin HEAD:main
