name: CLICK-FOOD Aplicar Repasse Automatico Entregador
# Trigger 2: aplicar interface financeira no app entregador.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-driver-auto-payout-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Aplicar interface de repasse automatico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/entregador/DriverProfessionalShell.tsx')
          s=p.read_text()

          old=' const[pixType,setPixType]=useState<PixType>("CPF");const[pixKey,setPixKey]=useState("");const[pixSaved,setPixSaved]=useState(false);const[pixBusy,setPixBusy]=useState(false);const[pixNotice,setPixNotice]=useState("");'
          new=' const[pixType,setPixType]=useState<PixType>("CPF");const[pixKey,setPixKey]=useState("");const[pixSaved,setPixSaved]=useState(false);const[pixBusy,setPixBusy]=useState(false);const[pixNotice,setPixNotice]=useState("");const[autoPayout,setAutoPayout]=useState(false);const[minimumPayout,setMinimumPayout]=useState("1,00");'
          if old not in s: raise SystemExit('state pattern not found')
          s=s.replace(old,new,1)

          start=s.index(' async function loadPixProfile()')
          end=s.index('\n\n async function findChatOrder()',start)
          replacement=''' async function loadPixProfile(){setPixNotice("");let id=driverId;if(!id&&session){const{data}=await supabase.from("drivers").select("id").eq("user_id",session.user.id).maybeSingle();id=data?.id?String(data.id):null;setDriverId(id);}if(!id){setPixSaved(false);setPixNotice("Conclua seu cadastro de entregador antes de cadastrar a chave PIX.");return;}const{data,error}=await supabase.functions.invoke("payout-profile-action",{body:{action:"READ_DRIVER"}});if(error||data?.error){setPixSaved(false);setPixNotice("Não foi possível carregar sua configuração PIX.");return;}const profile=data?.profile;if(profile){setPixType(String(profile.pix_key_type) as PixType);setPixKey(String(profile.pix_key));setAutoPayout(Boolean(profile.automatic_payout));setMinimumPayout(Number(profile.minimum_payout??1).toFixed(2).replace(".",","));setPixSaved(true);}else{setPixKey("");setPixType("CPF");setAutoPayout(false);setMinimumPayout("1,00");setPixSaved(false);}}
 function validPix(){const value=pixKey.trim();if(!value)return false;if(pixType==="EMAIL")return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value);if(pixType==="CPF")return value.replace(/\\D/g,"").length===11;if(pixType==="CNPJ")return value.replace(/\\D/g,"").length===14;if(pixType==="PHONE")return value.replace(/\\D/g,"").length>=10;return value.length>=20;}
 async function savePix(){if(!driverId){setPixNotice("Cadastro do entregador não encontrado.");return;}if(!validPix()){setPixNotice("Confira o tipo e o valor da chave PIX.");return;}const minimum=Number(minimumPayout.replace(",","."));if(!Number.isFinite(minimum)||minimum<0.01){setPixNotice("Informe um valor mínimo de repasse válido.");return;}setPixBusy(true);setPixNotice("");const{data,error}=await supabase.functions.invoke("payout-profile-action",{body:{action:"SAVE_DRIVER",pixKeyType:pixType,pixKey,automaticPayout:autoPayout,minimumPayout:minimum}});if(error||data?.error)setPixNotice(data?.error==="INVALID_PIX_KEY"?"Confira a chave PIX informada.":"Não foi possível salvar a configuração PIX.");else{setPixSaved(true);setPixNotice(autoPayout?"Repasse automático ativado para saldo online após a entrega.":"Chave PIX salva. Repasse automático está desligado.");}setPixBusy(false);}
 async function deletePix(){if(!driverId)return;setPixBusy(true);await supabase.from("driver_payout_profiles").delete().eq("driver_id",driverId);setPixKey("");setAutoPayout(false);setMinimumPayout("1,00");setPixSaved(false);setPixNotice("Chave PIX removida.");setPixBusy(false);}'''
          s=s[:start]+replacement+s[end:]

          ps=s.index(' function PixScreen()')
          pe=s.index('\n function ChatScreen()',ps)
          pix=''' function PixScreen(){const types:PixType[]=["CPF","CNPJ","EMAIL","PHONE","RANDOM"];return <ScrollView keyboardShouldPersistTaps="handled" contentContainerStyle={styles.page}><PageHeader title="Minha chave PIX" subtitle="Cadastre a chave que será usada para receber repasses."/><View style={styles.securityCard}><Text style={styles.securityIcon}>◆</Text><View style={styles.flex}><Text style={styles.cardTitle}>{pixSaved?"Chave PIX cadastrada":"Cadastre sua chave de recebimento"}</Text><Text style={styles.help}>A chave fica vinculada apenas ao seu cadastro de entregador e é protegida pelas regras de acesso do CLICK-FOOD.</Text></View></View>{!!pixNotice&&<Text style={styles.notice}>{pixNotice}</Text>}<Text style={styles.fieldLabel}>TIPO DE CHAVE</Text><View style={styles.typeRow}>{types.map(type=><Pressable key={type} style={[styles.typeButton,pixType===type&&styles.typeActive]} onPress={()=>setPixType(type)}><Text style={[styles.typeText,pixType===type&&styles.typeTextActive]}>{type==="PHONE"?"CELULAR":type==="RANDOM"?"ALEATÓRIA":type}</Text></Pressable>)}</View><Text style={styles.fieldLabel}>CHAVE PIX</Text><TextInput style={styles.input} autoCapitalize="none" placeholder={pixType==="EMAIL"?"seuemail@exemplo.com":pixType==="PHONE"?"+5562999999999":pixType==="RANDOM"?"Chave aleatória":"Digite somente os dados da chave"} value={pixKey} onChangeText={setPixKey}/><View style={styles.securityCard}><View style={styles.flex}><Text style={styles.cardTitle}>REPASSE AUTOMÁTICO</Text><Text style={styles.help}>Somente ganhos de pedidos pagos online por PIX/cartão entram no automático. O saldo só é liberado depois que a entrega estiver concluída.</Text></View></View><Text style={styles.fieldLabel}>VALOR MÍNIMO PARA ENVIAR</Text><TextInput style={styles.input} keyboardType="decimal-pad" placeholder="1,00" value={minimumPayout} onChangeText={setMinimumPayout}/><Pressable style={[styles.typeButton,autoPayout&&styles.typeActive]} onPress={()=>setAutoPayout(v=>!v)}><Text style={[styles.typeText,autoPayout&&styles.typeTextActive]}>{autoPayout?"✓ REPASSE AUTOMÁTICO ATIVADO":"ATIVAR REPASSE AUTOMÁTICO"}</Text></Pressable><Pressable style={[styles.primaryButton,pixBusy&&styles.disabled]} disabled={pixBusy} onPress={()=>void savePix()}><Text style={styles.primaryText}>{pixBusy?"SALVANDO...":"SALVAR CONFIGURAÇÃO PIX"}</Text></Pressable>{pixSaved&&<Pressable style={styles.deleteButton} disabled={pixBusy} onPress={()=>void deletePix()}><Text style={styles.deleteText}>REMOVER CHAVE PIX</Text></Pressable>}</ScrollView>}'''
          s=s[:ps]+pix+s[pe:]
          p.write_text(s)
          PY
      - name: Validar TypeScript
        run: npx tsc -p apps/entregador/tsconfig.json --noEmit
      - name: Commitar correção
        run: |
          git config user.name 'clickfood-bot'
          git config user.email 'clickfood-bot@users.noreply.github.com'
          git add apps/entregador/DriverProfessionalShell.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(entregador): ativar repasse PIX automatico'
          git push
