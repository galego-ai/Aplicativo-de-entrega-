name: CLICK-FOOD Aplicar Repasse Automatico Entregador

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-driver-auto-payout-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias
        run: npm ci --include=dev
      - name: Aplicar patch
        run: node .github/scripts/patch-driver-auto-payout-20260905.mjs
      - name: Validar TypeScript
        run: npx tsc -p apps/entregador/tsconfig.json --noEmit
      - name: Commit
        run: |
          git config user.name clickfood-bot
          git config user.email clickfood-bot@users.noreply.github.com
          git add apps/entregador/DriverProfessionalShell.tsx
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git commit -m 'feat(entregador): ativar repasse PIX automatico'
          git push
