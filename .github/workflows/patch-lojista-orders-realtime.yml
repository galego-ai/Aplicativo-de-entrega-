name: Patch lojista orders realtime
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch realtime Lojista
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text()
          marker='  useEffect(() => {\n    if (!store) return;\n    const timer = setInterval(() => loadStoreData(store), 20000);\n    return () => clearInterval(timer);\n  }, [store?.id]);\n'
          addition=marker+'\n  useEffect(() => {\n    if (!store) return;\n    const channel = supabase\n      .channel(`lojista-orders-${store.id}`)\n      .on("postgres_changes", { event: "*", schema: "public", table: "orders", filter: `store_id=eq.${store.id}` }, () => { void loadStoreData(store); })\n      .subscribe();\n    return () => { void supabase.removeChannel(channel); };\n  }, [store?.id]);\n'
          assert marker in s, 'polling effect target missing'
          assert 'lojista-orders-${store.id}' not in s, 'already patched'
          s=s.replace(marker,addition,1)
          p.write_text(s)
      - name: Build Lojista
        run: |
          npm install
          npm run build --workspace=@clickfood/lojista
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lojista/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: atualizar pedidos do lojista em realtime"
          git push
