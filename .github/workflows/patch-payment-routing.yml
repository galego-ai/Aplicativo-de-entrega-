name: Patch payment routing
on:
  push:
    paths:
      - .github/workflows/patch-payment-routing.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch create-order provider routing
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/create-order/index.ts')
          s = p.read_text()
          old_methods = 'const allowedPaymentMethods = new Set(["PIX", "CREDIT_CARD", "DEBIT_CARD", "CASH", "WALLET"]);'
          new_methods = 'const allowedPaymentMethods = new Set(["PIX", "CREDIT_CARD", "CASH"]);'
          if old_methods not in s:
              raise SystemExit('allowed payment methods marker not found')
          s = s.replace(old_methods, new_methods, 1)
          marker = '''    if (body.items.length > 100) return Response.json({ error: "TOO_MANY_ITEMS" }, { status: 400 });\n\n'''
          insert = '''    if (body.items.length > 100) return Response.json({ error: "TOO_MANY_ITEMS" }, { status: 400 });\n\n    if (body.paymentMethod !== "CASH") {\n      const { data: efiConfig, error: paymentConfigError } = await ctx.supabaseAdmin\n        .from("payment_provider_configs")\n        .select("enabled,credentials_configured,supported_methods")\n        .eq("provider", "EFI")\n        .maybeSingle();\n      if (paymentConfigError) return Response.json({ error: "PAYMENT_CONFIG_LOOKUP_FAILED" }, { status: 500 });\n      if (!efiConfig?.enabled || !efiConfig.credentials_configured || !(efiConfig.supported_methods ?? []).includes(body.paymentMethod)) {\n        return Response.json({ error: "PAYMENT_METHOD_UNAVAILABLE", method: body.paymentMethod }, { status: 409 });\n      }\n    }\n\n'''
          if marker not in s:
              raise SystemExit('validation marker not found')
          s = s.replace(marker, insert, 1)
          old_provider = '    const paymentProvider = isOfflinePayment ? null : (Deno.env.get("PAYMENT_PROVIDER") ?? "UNCONFIGURED");'
          new_provider = '    const paymentProvider = isOfflinePayment ? null : "EFI";'
          if old_provider not in s:
              raise SystemExit('provider marker not found')
          s = s.replace(old_provider, new_provider, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add supabase/functions/create-order/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: rotear checkout online somente por executor ativo"
          git push
