name: Patch refund Lojista

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-refund-lojista.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Lojista refund UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text()

          old='type Order = { id: string; order_number: number; customer_id: string | null; total: number; status: string; payment_status: string; delivery_type: string; source: string; created_at: string };\n'
          new=old+'type RefundInfo = { payment_id: string; status: string; amount: number; created_at: string; completed_at: string | null };\n'
          assert old in s
          s=s.replace(old,new,1)

          old='const dateTime = (value: string) => new Date(value).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });\n'
          new=old+'const paymentLabels: Record<string,string> = { PENDING:"Pagamento pendente", PAID:"Pago", FAILED:"Pagamento falhou", CANCELLED:"Pagamento cancelado", PARTIALLY_REFUNDED:"Estorno parcial", REFUNDED:"Estornado" };\nconst refundLabels: Record<string,string> = { PENDING:"Estorno solicitado", PROCESSING:"Estorno em processamento", COMPLETED:"PIX devolvido", FAILED:"Falha no estorno", CANCELLED:"Estorno cancelado" };\n'
          assert old in s
          s=s.replace(old,new,1)

          old='  const [orders, setOrders] = useState<Order[]>([]);\n'
          new=old+'  const [refundByOrder, setRefundByOrder] = useState<Record<string, RefundInfo>>({});\n  const [refundBusyOrderId, setRefundBusyOrderId] = useState<string | null>(null);\n'
          assert old in s
          s=s.replace(old,new,1)

          marker='  async function loadStoreData(currentStore = store) {\n'
          insert='  async function loadStoreRefunds(orderRows: any[]) {\n    const orderIds = orderRows.map((order) => String(order.id));\n    if (!orderIds.length) { setRefundByOrder({}); return; }\n    const { data: payments, error: paymentError } = await supabase.from("payments").select("id,order_id").in("order_id", orderIds).eq("method", "PIX");\n    if (paymentError || !payments?.length) { setRefundByOrder({}); return; }\n    const paymentToOrder = new Map(payments.map((payment: any) => [String(payment.id), String(payment.order_id)]));\n    const { data: refunds, error: refundError } = await supabase.from("refunds").select("payment_id,status,amount,created_at,completed_at").in("payment_id", payments.map((payment: any) => payment.id)).order("created_at", { ascending: false });\n    if (refundError) { setRefundByOrder({}); return; }\n    const next: Record<string, RefundInfo> = {};\n    for (const raw of refunds ?? []) {\n      const orderId = paymentToOrder.get(String((raw as any).payment_id));\n      if (orderId && !next[orderId]) next[orderId] = { ...(raw as any), amount: Number((raw as any).amount) } as RefundInfo;\n    }\n    setRefundByOrder(next);\n  }\n\n'
          assert marker in s
          s=s.replace(marker,insert+marker,1)

          old='    if (ordersResult.data) setOrders(ordersResult.data.map((item: any) => ({ ...item, total: Number(item.total) })));\n'
          new='    if (ordersResult.data) { const normalizedOrders=ordersResult.data.map((item: any) => ({ ...item, total: Number(item.total) })); setOrders(normalizedOrders); await loadStoreRefunds(normalizedOrders); }\n'
          assert old in s
          s=s.replace(old,new,1)

          old='    } else {\n      setMessage(error || data?.error ? "Não foi possível atualizar o pedido." : "Pedido atualizado.");\n    }\n'
          new='    } else {\n      if (error || data?.error) setMessage("Não foi possível atualizar o pedido.");\n      else if (data?.refundRequired) { const status=String(data?.refundStatus??"PENDING"); setMessage(status==="COMPLETED"?"Pedido recusado e PIX devolvido ao cliente.":status==="FAILED"?"Pedido recusado. A devolução PIX falhou e precisa ser reconciliada.":"Pedido recusado. A devolução PIX foi solicitada e está em processamento."); }\n      else setMessage("Pedido atualizado.");\n    }\n'
          assert old in s
          s=s.replace(old,new,1)

          marker='  async function retryDispatch(order: Order) {\n'
          insert='  async function reconcileStoreRefund(order: Order) {\n    setRefundBusyOrderId(order.id); setMessage("");\n    const { data, error } = await supabase.functions.invoke("efi-pix-refund", { body: { orderId: order.id, reason: "Reconciliação de estorno pelo Painel Lojista" } });\n    if (error || data?.error) setMessage("Não foi possível consultar a devolução PIX agora.");\n    else { const status=String(data?.refundStatus??""); setMessage(status==="COMPLETED"?"PIX devolvido ao cliente.":status==="FAILED"?"A devolução falhou na Efí e pode ser tentada novamente.":"A devolução continua em processamento."); }\n    await loadStoreData(store); setRefundBusyOrderId(null);\n  }\n\n'
          assert marker in s
          s=s.replace(marker,insert+marker,1)

          old='            <strong>{brl(order.total)}</strong><p>{order.status} • {order.payment_status}</p>\n            <div className="queueActions">\n'
          new='            <strong>{brl(order.total)}</strong><p>{order.status} • {paymentLabels[order.payment_status] ?? order.payment_status}</p>\n            {refundByOrder[order.id] && <div style={{margin:"8px 0",padding:"9px 10px",borderRadius:10,background:refundByOrder[order.id].status==="COMPLETED"?"#e5f7ea":refundByOrder[order.id].status==="FAILED"?"#fde9e7":"#fff7d9",fontSize:12,fontWeight:800}}>{refundLabels[refundByOrder[order.id].status] ?? refundByOrder[order.id].status} • {brl(refundByOrder[order.id].amount)}{["PENDING","PROCESSING","FAILED"].includes(refundByOrder[order.id].status) && <button style={{marginLeft:8}} disabled={refundBusyOrderId===order.id} onClick={() => reconcileStoreRefund(order)}>{refundBusyOrderId===order.id?"Consultando...":"Atualizar estorno"}</button>}</div>}\n            {!refundByOrder[order.id] && ["CANCELLED","REJECTED"].includes(order.status) && ["PAID","PARTIALLY_REFUNDED"].includes(order.payment_status) && <button style={{marginBottom:8}} disabled={refundBusyOrderId===order.id} onClick={() => reconcileStoreRefund(order)}>{refundBusyOrderId===order.id?"Consultando...":"Consultar estorno PIX"}</button>}\n            <div className="queueActions">\n'
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "click-food-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/lojista/app/page.tsx
          git commit -m "feat: exibir estornos PIX no Painel Lojista"
          git push
