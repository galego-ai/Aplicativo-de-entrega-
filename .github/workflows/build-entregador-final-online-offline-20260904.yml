name: CLICK-FOOD Entregador APK Final Online Offline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-entregador-final-online-offline-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK Final Entregador
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      JAVA_TOOL_OPTIONS: '-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configurar Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          EOF
      - name: Instalar e validar
        run: |
          npm ci --include=dev
          cd apps/entregador
          npx tsc --noEmit
          grep -q 'FICAR OFFLINE' App.tsx
          grep -q 'FICAR ONLINE' App.tsx
          grep -q 'stopFloatingBubble' App.tsx
          grep -q 'driver-offer-feed' App.tsx
          grep -q 'withClickFoodFloatingBubble' app.json
          test -f plugins/withClickFoodFloatingBubble.js
          npx --yes eas-cli@latest whoami >/dev/null
          npx --yes eas-cli@latest project:info --non-interactive
      - name: Preparar Google Maps
        working-directory: apps/entregador
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_MAPS_API_KEY:-}" ] || [ -n "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ] || [ -n "${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}" ] || [ -n "${EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY:-}" ]; then exit 0; fi
          TMP="$RUNNER_TEMP/maps-final"
          mkdir -p "$TMP"
          npx --yes eas-cli@latest build:list --platform android --status finished --limit 10 --non-interactive --json > "$TMP/builds.json"
          mapfile -t URLS < <(jq -r '.[] | (.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty)' "$TMP/builds.json")
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$APKANALYZER"
          KEY=''
          INDEX=0
          for URL in "${URLS[@]}"; do
            INDEX=$((INDEX+1)); PRIOR="$TMP/$INDEX.apk"
            curl --fail --silent --show-error --location --retry 2 "$URL" -o "$PRIOR" || continue
            unzip -tq "$PRIOR" >/dev/null 2>&1 || continue
            "$APKANALYZER" manifest print "$PRIOR" > "$TMP/$INDEX.xml"
            CANDIDATE="$(perl -0777 -ne 'if(/<meta-data\b(?=[^>]*com\.google\.android\.geo\.API_KEY)[^>]*android:value="([^"]+)"/s){print $1}' "$TMP/$INDEX.xml")"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != 'CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED' ]; then KEY="$CANDIDATE"; break; fi
          done
          test -n "$KEY"
          echo "::add-mask::$KEY"
          echo "GOOGLE_MAPS_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "GOOGLE_MAPS_ANDROID_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Compilar APK final
        working-directory: apps/entregador
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/apk-final"
          mkdir -p "$OUT"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$OUT"
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive
          APK="$(find "$OUT" -type f -name '*.apk' | head -n 1 || true)"
          [ -n "$APK" ] || APK="$(find . -type f -name '*.apk' | head -n 1 || true)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/CLICK-FOOD-Entregador-FINAL.apk"
          unzip -tq "$GITHUB_WORKSPACE/artifacts/CLICK-FOOD-Entregador-FINAL.apk" >/dev/null
      - name: Validar recursos nativos no APK
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/CLICK-FOOD-Entregador-FINAL.apk'
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          "$APKANALYZER" manifest print "$APK" > "$RUNNER_TEMP/final-manifest.xml"
          grep -q 'com.google.android.geo.API_KEY' "$RUNNER_TEMP/final-manifest.xml"
          ! grep -q 'CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED' "$RUNNER_TEMP/final-manifest.xml"
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$RUNNER_TEMP/final-manifest.xml"
          grep -q 'FloatingBubbleService' "$RUNNER_TEMP/final-manifest.xml"
          echo 'APK final validado: Maps + bolinha nativa.'
      - uses: actions/upload-artifact@v4
        with:
          name: CLICK-FOOD-Entregador-APK-FINAL
          path: artifacts/CLICK-FOOD-Entregador-FINAL.apk
          if-no-files-found: error
          retention-days: 30
