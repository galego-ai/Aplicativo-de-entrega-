name: Patch Driver History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-driver-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch App Entregador
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/entregador/App.tsx')
          s=p.read_text()
          old_type='type HistoryItem = { id: string; driver_earning: number; delivered_at: string | null };'
          new_type='type HistoryItem = { id:string; orderNumber:number|null; storeName:string; deliveryFee:number; driverEarning:number; pickupAt:string|null; deliveredAt:string|null; durationMinutes:number|null };'
          assert old_type in s
          s=s.replace(old_type,new_type,1)
          old_load='async function loadHistory(driverId=driver?.id){if(!driverId)return;const {data}=await supabase.from("deliveries").select("id,driver_earning,delivered_at").eq("driver_id",driverId).eq("status","DELIVERED").order("delivered_at",{ascending:false}).limit(30);setHistory((data??[]).map((x:any)=>({...x,driver_earning:Number(x.driver_earning)})));}'
          new_load='async function loadHistory(_driverId?:string){const {data,error}=await supabase.functions.invoke("driver-delivery-history",{body:{}});if(error||data?.error){setMessage("Não foi possível atualizar o histórico de entregas.");return;}setHistory((data?.history??[]) as HistoryItem[]);}'
          assert old_load in s
          s=s.replace(old_load,new_load,1)
          old_total='const completedTotal=useMemo(()=>history.reduce((sum,item)=>sum+item.driver_earning,0),[history]);'
          new_total='const completedTotal=useMemo(()=>history.reduce((sum,item)=>sum+item.driverEarning,0),[history]);'
          assert old_total in s
          s=s.replace(old_total,new_total,1)
          old_view='const historyView=<ScrollView contentContainerStyle={styles.content}><View style={styles.rowBetween}><Text style={styles.pageTitle}>Minhas entregas</Text><Pressable onPress={()=>loadHistory()}><Text style={styles.link}>Atualizar</Text></Pressable></View>{history.length?history.map(item=><View style={styles.listRow} key={item.id}><View><Text style={styles.listTitle}>Entrega {item.id.slice(0,8)}</Text><Text style={styles.listMeta}>{item.delivered_at?new Date(item.delivered_at).toLocaleDateString("pt-BR"):"Concluída"}</Text></View><Text style={styles.listValue}>{brl(item.driver_earning)}</Text></View>):<Text style={styles.notice}>Nenhuma entrega concluída ainda.</Text>}</ScrollView>;'
          new_view='const historyView=<ScrollView contentContainerStyle={styles.content}><View style={styles.rowBetween}><View><Text style={styles.pageTitle}>Minhas entregas</Text><Text style={styles.listMeta}>{history.length} entrega(s) no histórico • {brl(completedTotal)} em ganhos</Text></View><Pressable onPress={()=>loadHistory()}><Text style={styles.link}>Atualizar</Text></Pressable></View>{history.length?history.map(item=><View style={styles.listRow} key={item.id}><View style={{flex:1}}><Text style={styles.listTitle}>{item.orderNumber!=null?`Pedido #${item.orderNumber}`:"Entrega concluída"} • {item.storeName}</Text><Text style={styles.listMeta}>{item.deliveredAt?new Date(item.deliveredAt).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"Concluída"}{item.durationMinutes!=null?` • ${item.durationMinutes} min`:""} • taxa {brl(item.deliveryFee)}</Text></View><Text style={styles.listValue}>+ {brl(item.driverEarning)}</Text></View>):<Text style={styles.notice}>Nenhuma entrega concluída ainda.</Text>}</ScrollView>;'
          assert old_view in s
          s=s.replace(old_view,new_view,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Type-check Entregador
        run: npx tsc --noEmit -p apps/entregador/tsconfig.json
      - name: Commit patch
        run: |
          git config user.name "click-food-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/entregador/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: melhorar histórico de entregas no app entregador"
          git push
