name: CLICK-FOOD One-shot Customer Storefront

on:
  push:
    paths:
      - .github/workflows/one-shot-customer-storefront.yml

permissions:
  contents: write

jobs:
  patch-customer-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar patch validado
        run: python3 scripts/patch-customer-storefront.py
      - name: Commitar alteração do Cliente
        shell: bash
        run: |
          if git diff --quiet -- apps/cliente/App.tsx; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cliente/App.tsx
          git commit -m "Organizar cardápio Cliente por categorias e modalidades"
          git push origin HEAD:main
