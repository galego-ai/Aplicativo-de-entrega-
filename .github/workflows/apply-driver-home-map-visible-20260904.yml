name: CLICK-FOOD Home Entregador Mapa Permanente 2026-09-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-driver-home-map-visible-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar ajuste da Home do entregador
        run: python3 scripts/apply-driver-home-map-visible-20260904.py
      - name: Corrigir tipagem da captura do entregador
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/entregador/App.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if(!driver||driver.status!=="ACTIVE")return;\n    let subscription:Location.LocationSubscription|undefined;', 'if(!driver||driver.status!=="ACTIVE")return;\n    const driverId=driver.id;\n    const isOnline=driver.online;\n    let subscription:Location.LocationSubscription|undefined;', 1)
          s=s.replace('driver_id:driver.id,latitude:position.coords.latitude', 'driver_id:driverId,latitude:position.coords.latitude', 1)
          s=s.replace('await applyPosition(current,driver.online);', 'await applyPosition(current,isOnline);', 1)
          s=s.replace('if(cancelled||!driver.online)return;', 'if(cancelled||!isOnline)return;', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Instalar dependências
        run: npm ci --include=dev
      - name: Validar TypeScript do Entregador
        run: npx tsc --noEmit -p apps/entregador/tsconfig.json
      - name: Validar mapa permanente e ausência de ScrollView na Home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('apps/entregador/App.tsx').read_text(encoding='utf-8')
          live=Path('apps/entregador/DriverLiveMap.tsx').read_text(encoding='utf-8')
          home=app.split('  const home=',1)[1].split('\n\n  const historyView=',1)[0]
          if '<DriverLiveMap online={driver.online} location={driverLocation} active={active}/>' not in home:
              raise SystemExit('Mapa permanente nao encontrado na Home.')
          if '<ScrollView' in home:
              raise SystemExit('A Home ainda contem ScrollView.')
          if 'driverPosition' not in live or '?? driverPosition' not in live:
              raise SystemExit('Mapa nao usa localizacao do entregador como centro inicial.')
          if 'Location.getCurrentPositionAsync' not in app:
              raise SystemExit('GPS inicial nao foi configurado.')
          if 'const driverId=driver.id;' not in app:
              raise SystemExit('Captura segura do driverId nao foi aplicada.')
          print('Validacao da Home do entregador concluida.')
          PY
      - name: Commit e push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'click-food-ci'
          git config user.email 'click-food-ci@users.noreply.github.com'
          git add apps/entregador/App.tsx apps/entregador/DriverLiveMap.tsx
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git commit -m 'fix(entregador): manter mapa visivel e home sem rolagem'
          git push origin HEAD:main
