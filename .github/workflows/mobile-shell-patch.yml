name: CLICK-FOOD Mobile Shell Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-shell-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alterações pontuais
        run: node scripts/fix-mobile-professional-shell.mjs

      - name: Validar diff esperado
        run: |
          git diff --check
          git diff -- apps/cliente/App.tsx apps/cliente/CustomerProfessionalShell.tsx apps/entregador/DriverProfessionalShell.tsx

      - name: Publicar acabamento
        run: |
          git config user.name "clickfood-automation"
          git config user.email "clickfood-automation@users.noreply.github.com"
          git add apps/cliente/App.tsx apps/cliente/CustomerProfessionalShell.tsx apps/entregador/DriverProfessionalShell.tsx
          git commit -m "fix(mobile): finalizar menus profissionais e endereço fora do checkout"
          git push origin HEAD:main
