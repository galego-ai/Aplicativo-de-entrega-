name: CLICK-FOOD Corrigir Branding e Release Entregador

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-entregador-branding-release-20260906.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar PNGs oficiais CLICK-FOOD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = [
              Path('apps/entregador/assets/clickfood-entregador-icon.png'),
              Path('apps/entregador/assets/clickfood-entregador-splash.png'),
          ]
          for p in files:
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  if im.format != 'PNG' or im.width < 240 or im.height < 240:
                      raise SystemExit(f'Asset invalido: {p}')
                  print(f'OK {p}: {im.width}x{im.height}')
          PY

      - name: Migrar splash para Expo 57
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('apps/entregador/app.json')
          data = json.loads(app_path.read_text(encoding='utf-8'))
          expo = data['expo']
          expo['icon'] = './assets/clickfood-entregador-icon.png'
          expo.pop('splash', None)

          plugins = expo.get('plugins', [])
          plugins = [p for p in plugins if not (p == 'expo-splash-screen' or (isinstance(p, list) and p and p[0] == 'expo-splash-screen'))]
          plugins.append([
              'expo-splash-screen',
              {
                  'backgroundColor': '#000000',
                  'image': './assets/clickfood-entregador-splash.png',
                  'imageWidth': 240,
                  'resizeMode': 'contain'
              }
          ])
          expo['plugins'] = plugins
          app_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pkg_path = Path('apps/entregador/package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg.setdefault('dependencies', {})['expo-splash-screen'] = '~57.0.8'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Atualizar lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Validar TypeScript e configuracao Expo
        working-directory: apps/entregador
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx expo config --type public --json > /tmp/expo-entregador.json
          grep -q 'clickfood-entregador-icon.png' /tmp/expo-entregador.json
          grep -q 'expo-splash-screen' /tmp/expo-entregador.json

      - name: Commitar configuracao final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/entregador/app.json apps/entregador/package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(entregador): finalizar branding oficial para Expo 57'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Disparar build final Cliente e Entregador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-release-final-20260906.yml --ref main
