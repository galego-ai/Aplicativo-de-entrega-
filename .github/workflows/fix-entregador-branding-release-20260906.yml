name: CLICK-FOOD Corrigir Branding e Release Entregador

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-entregador-branding-release-20260906.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar conversor de imagem
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Regenerar icone e splash oficiais em PNG valido
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          assets = Path('apps/entregador/assets')
          source = assets / 'clickfood-entregador-splash.jpg'
          if not source.exists():
              raise SystemExit('Splash oficial CLICK-FOOD nao encontrado.')

          logo = Image.open(source).convert('RGBA')

          def centered(size, max_logo, background):
              canvas = Image.new('RGBA', (size, size), background)
              fitted = ImageOps.contain(logo, (max_logo, max_logo), Image.Resampling.LANCZOS)
              x = (size - fitted.width) // 2
              y = (size - fitted.height) // 2
              canvas.alpha_composite(fitted, (x, y))
              return canvas

          icon = centered(1024, 920, (245, 245, 245, 255))
          icon_path = assets / 'clickfood-entregador-icon.png'
          icon.save(icon_path, format='PNG', optimize=False, compress_level=6)

          splash = centered(1024, 760, (245, 245, 245, 255))
          splash_path = assets / 'clickfood-entregador-splash.png'
          splash.save(splash_path, format='PNG', optimize=False, compress_level=6)

          for p in (icon_path, splash_path):
              with Image.open(p) as check:
                  check.verify()
              with Image.open(p) as check:
                  if check.format != 'PNG' or check.size != (1024, 1024):
                      raise SystemExit(f'Asset invalido: {p}')
              print(f'OK {p}')
          PY

      - name: Migrar splash para Expo 57
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('apps/entregador/app.json')
          data = json.loads(app_path.read_text(encoding='utf-8'))
          expo = data['expo']
          expo['icon'] = './assets/clickfood-entregador-icon.png'
          expo.pop('splash', None)

          plugins = expo.get('plugins', [])
          plugins = [p for p in plugins if not (p == 'expo-splash-screen' or (isinstance(p, list) and p and p[0] == 'expo-splash-screen'))]
          plugins.append([
              'expo-splash-screen',
              {
                  'backgroundColor': '#F5F5F5',
                  'image': './assets/clickfood-entregador-splash.png',
                  'imageWidth': 240,
                  'resizeMode': 'contain'
              }
          ])
          expo['plugins'] = plugins
          app_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pkg_path = Path('apps/entregador/package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg.setdefault('dependencies', {})['expo-splash-screen'] = '~57.0.8'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Atualizar lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar e validar release
        run: npm ci --include=dev

      - name: Validar TypeScript e configuracao Expo
        working-directory: apps/entregador
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: CLICK_FOOD_MAPS_KEY_NOT_CONFIGURED
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx expo config --type public --json > /tmp/expo-entregador.json
          grep -q 'clickfood-entregador-icon.png' /tmp/expo-entregador.json
          grep -q 'expo-splash-screen' /tmp/expo-entregador.json

      - name: Commitar correcao de release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/entregador/assets/clickfood-entregador-icon.png apps/entregador/assets/clickfood-entregador-splash.png apps/entregador/app.json apps/entregador/package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(entregador): normalizar logo e splash para release Expo 57'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Disparar build final Cliente e Entregador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-release-final-20260906.yml --ref main
