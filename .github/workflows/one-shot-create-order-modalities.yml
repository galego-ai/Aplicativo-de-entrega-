name: CLICK-FOOD One-shot Create Order Modalities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-create-order-modalities.yml'

permissions:
  contents: write

jobs:
  patch-create-order-modalities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Revalidar entrega e retirada no create-order
        run: python3 scripts/patch_create_order_modalities.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/create-order/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Revalidar modalidades da loja ao criar pedido"
          git push origin main
