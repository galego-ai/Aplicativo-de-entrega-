name: CLICK-FOOD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Testar regras críticas compartilhadas
        run: npm run test:shared

      - name: Proteger pedidos contra desvio para canais externos
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="supabase/functions/store-catalog/index.ts"
          CHAT="supabase/functions/send-message/index.ts"
          CLIENT="apps/cliente/App.tsx"

          if grep -E 'select\("[^"]*(phone|whatsapp|instagram|email)' "$CATALOG"; then
            echo "ERRO: catálogo público voltou a selecionar contato administrativo da loja."
            exit 1
          fi

          if grep -E 'selectedStore\.(phone|whatsapp|instagram|email)|store\.(phone|whatsapp|instagram|email)' "$CLIENT"; then
            echo "ERRO: app Cliente está tentando exibir contato administrativo da loja."
            exit 1
          fi

          grep -q 'CONTACT_SHARING_BLOCKED' "$CHAT"
          grep -q 'name:"PHONE"' "$CHAT"
          grep -q 'name:"DOMAIN"' "$CHAT"
          grep -q 'name:"SOCIAL_HANDLE"' "$CHAT"

      - name: Proteger pausa operacional da loja
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION="supabase/migrations/202609011830_manual_store_order_pause.sql"
          PAUSE_FN="supabase/functions/store-order-pause/index.ts"
          CATALOG="supabase/functions/store-catalog/index.ts"
          CLIENT="apps/cliente/App.tsx"
          LOJISTA="apps/lojista/app/StoreOrderPauseControl.tsx"
          CREATE_ORDER="supabase/functions/create-order/index.ts"

          grep -q 'orders_paused boolean not null default false' "$MIGRATION"
          grep -q 'if v_orders_paused then return false' "$MIGRATION"
          grep -q '\["OWNER","MANAGER"\]' "$PAUSE_FN"
          grep -q 'STORE_ORDERS_PAUSED' "$PAUSE_FN"
          grep -q 'STORE_ORDERS_RESUMED' "$PAUSE_FN"
          grep -q 'update({orders_paused:body.paused})' "$PAUSE_FN"
          grep -q 'orders_paused' "$CATALOG"
          grep -q 'orders_paused' "$CLIENT"
          grep -q 'store-order-pause' "$LOJISTA"
          grep -q 'store_is_open' "$CREATE_ORDER"
          if grep -E 'update\(\{[^}]*status:' "$PAUSE_FN"; then
            echo "ERRO: pausa operacional não pode alterar o status administrativo da loja."
            exit 1
          fi

      - name: Build Painel Matriz
        run: npm run build:admin

      - name: Build Painel Lojista
        run: npm run build:lojista

      - name: Type-check App Cliente
        run: npx tsc --noEmit -p apps/cliente/tsconfig.json

      - name: Validate Expo config Cliente
        run: cd apps/cliente && GOOGLE_MAPS_ANDROID_API_KEY=CI_MAPS_KEY_PLACEHOLDER npx expo config --type public >/dev/null

      - name: Type-check App Entregador
        run: npx tsc --noEmit -p apps/entregador/tsconfig.json

      - name: Validate Expo config Entregador
        run: cd apps/entregador && GOOGLE_MAPS_ANDROID_API_KEY=CI_MAPS_KEY_PLACEHOLDER npx expo config --type public >/dev/null
