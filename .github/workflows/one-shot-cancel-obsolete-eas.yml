name: CLICK-FOOD One Shot Cancel Obsolete EAS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cancel-obsolete-eas.yml'

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cancelar apenas builds Android EAS obsoletos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for RUN_ID in 33686201632 33689069319; do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')
            if [ "$STATUS" != "completed" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
              echo "Cancelamento solicitado para run ${RUN_ID} (${STATUS})."
            else
              echo "Run ${RUN_ID} já concluído."
            fi
          done
      - name: Remover workflow temporário
        run: |
          git config user.name 'galego-ai'
          git config user.email 'elismarribeiro298@gmail.com'
          git rm .github/workflows/one-shot-cancel-obsolete-eas.yml
          git commit -m 'chore(ci): remover cancelador temporário EAS'
          git push origin HEAD:main
