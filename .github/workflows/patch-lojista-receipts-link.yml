name: Patch Lojista Receipts Link

on:
  push:
    paths:
      - '.github/workflows/patch-lojista-receipts-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add receipts shortcut
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lojista/app/page.tsx')
          s=p.read_text()
          marker='<a href="/entregadores" style={{display:"block",margin:"10px 0",padding:"12px 14px",borderRadius:10,background:"#f4c400",color:"#111",fontWeight:900,textDecoration:"none",textAlign:"center"}}>Atribuir entregador</a>'
          if s.count(marker) != 1:
              raise SystemExit(f'Expected driver link exactly once, found {s.count(marker)}')
          link=marker+'<a href="/recibos" style={{display:"block",margin:"10px 0",padding:"12px 14px",borderRadius:10,background:"#fff",border:"1px solid #d8d8d8",color:"#111",fontWeight:900,textDecoration:"none",textAlign:"center"}}>Recibos / imprimir</a>'
          p.write_text(s.replace(marker,link,1))
          PY
      - run: npm install --ignore-scripts
      - run: npm run build --workspace=@clickfood/lojista
      - name: Commit patch
        run: |
          git config user.name "galego-ai"
          git config user.email "elismarribeiro298@gmail.com"
          git add apps/lojista/app/page.tsx
          git commit -m "feat: adicionar atalho de recibos ao lojista" || exit 0
          git push
